<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4FF;--card:#fff;--ink:#1B2A4A;--mu:#6B7A99;--ln:#DCE6FA;--ac:#4F7CF0;--as:#E3ECFF;--ok:#25A57A;--wn:#E5703F;--rd:#E5484D;--yl:#F5B83D}
:root[data-t=dark]{--bg:#0E1526;--card:#18223B;--ink:#EAF0FF;--mu:#96A3C4;--ln:#2A3759;--ac:#7FA2FF;--as:#233157;--ok:#4FD1A5;--wn:#FF9566;--rd:#FF7378;--yl:#FFD166}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3{margin:0;line-height:1.2}h1{font-size:1.5rem}h2{font-size:1.1rem;margin-bottom:8px}
.mu{color:var(--mu);font-size:.88rem}
#side{position:fixed;inset:0 auto 0 0;width:196px;background:var(--card);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
#side .lg{font-weight:800;font-size:1.2rem;padding:0 8px 14px}
#side button{display:flex;gap:10px;align-items:center;background:none;color:var(--mu);text-align:left;padding:10px;border-radius:10px;border:0;font:inherit;font-weight:600;cursor:pointer}
#side button[aria-current=page]{background:var(--as);color:var(--ac)}
main{margin-left:196px;padding:22px;max-width:1000px}
.g{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.g>.c{margin:0}
.hero{background:linear-gradient(120deg,var(--as),var(--card));display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
#clk{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ac)}
.st b{display:block;font-size:1.5rem}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.b.s{background:var(--as);color:var(--ac)}.b.sm{padding:4px 9px;font-size:.82rem}.b.x{background:none;color:var(--mu);padding:4px 8px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.f>*{flex:1 1 130px}.f>.n{flex:0 0 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs .b{flex:0 0 auto}
.tk{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}.tk:last-child{border:0}
.tk input[type=checkbox]{width:20px;height:20px;flex:0 0 auto;accent-color:var(--ac);padding:0}
.tk>div{flex:1;min-width:0}.tk.dn b{text-decoration:line-through;color:var(--mu)}.tk select{width:auto}
.tk input[type=number]{width:62px}
.tag{display:inline-block;font-size:.75rem;background:var(--as);color:var(--ac);border-radius:20px;padding:0 8px;margin-right:4px}
.tag.Tinggi,.tag.Top{background:#E5484D22;color:var(--rd)}.tag.Sedang{background:#F5B83D33;color:var(--wn)}
.bar{height:8px;background:var(--ln);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.tm{font-size:4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal button{aspect-ratio:1;border:1px solid var(--ln);background:var(--bg);border-radius:10px;cursor:pointer;position:relative;padding:0}
.cal button.td{border-color:var(--ac);font-weight:800}.cal button.sl{background:var(--ac);color:#fff}
.cal button i{position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--wn)}
.cal small{color:var(--mu)}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}.bars div{flex:1;text-align:center;font-size:.72rem;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px}
.mo{display:flex;gap:8px;flex-wrap:wrap}.mo button{font-size:1.8rem;background:var(--bg);border:2px solid var(--ln);border-radius:14px;padding:6px 10px;cursor:pointer}.mo button.on{border-color:var(--ac);background:var(--as)}
.sn{display:flex;gap:8px;flex-wrap:wrap}.sn div{background:#FFF3B8;color:#4A3F00;border-radius:10px;padding:10px;width:150px;font-size:.88rem;position:relative}
.sn div:nth-child(2n){background:#CFE3FF;color:#17325E}.sn div:nth-child(3n){background:#D5F5E3;color:#15432E}
.sn button{position:absolute;top:0;right:2px;background:none;border:0;cursor:pointer;color:inherit}
#dw{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#dw.on{display:flex}#dw .tm{font-size:6rem}
.tl{display:grid;grid-template-columns:54px 1fr;gap:4px 8px}.tl span{color:var(--mu);font-variant-numeric:tabular-nums}
@media(max-width:820px){
#side{inset:auto 0 0 0;width:auto;flex-direction:row;overflow-x:auto;border:0;border-top:1px solid var(--ln);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0));z-index:10}
#side .lg{display:none}#side button{flex-direction:column;gap:0;font-size:.68rem;padding:6px 10px;flex:0 0 auto}
main{margin:0;padding:14px 12px 96px}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.tm{font-size:3.2rem}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
/* ===================== FocusNest v2 · aesthetic & fitur baru ===================== */
:root{--b1:rgba(255,184,217,.45);--b2:rgba(160,214,255,.5);--b3:rgba(196,178,255,.4);--sh:0 6px 18px rgba(79,124,240,.10)}
:root[data-t=dark]{--b1:rgba(255,115,160,.12);--b2:rgba(79,140,255,.16);--b3:rgba(140,100,255,.14);--sh:0 6px 18px rgba(0,0,0,.25)}
body{background-color:var(--bg);background-image:radial-gradient(520px 380px at 92% -4%,var(--b1),transparent 70%),radial-gradient(640px 460px at -6% 22%,var(--b2),transparent 70%),radial-gradient(560px 460px at 70% 108%,var(--b3),transparent 70%);background-attachment:fixed;min-height:100vh}
h1,h2,h3,#side .lg,.mh{font-family:"Fredoka","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h3{font-size:.98rem}
.c{box-shadow:var(--sh)}
main{position:relative;z-index:1}
#side{z-index:5;overflow-y:auto}
#side .lg{display:flex;gap:6px;align-items:center}
#side .lgt{background:linear-gradient(90deg,var(--ac),#FF7AB6);-webkit-background-clip:text;background-clip:text;color:transparent}
#side button span{display:inline-block;transition:transform .2s}
#side button:hover span{transform:scale(1.25) rotate(-8deg)}
#side button[aria-current=page]{background:linear-gradient(90deg,var(--as),transparent);box-shadow:inset 3px 0 0 var(--ac)}
#side .pt{margin-top:auto;background:linear-gradient(135deg,var(--as),var(--card));border:1px solid var(--ln);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
#side .pt .bar{margin:4px 0 0}
.hero{background:linear-gradient(120deg,var(--as),var(--card) 60%,rgba(255,184,217,.25))}
.b{box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .12s,filter .15s}
.b.x{box-shadow:none}
.b:hover{filter:brightness(1.07);transform:translateY(-1px)}
.b:active{transform:translateY(1px) scale(.97)}
.bar i{background:linear-gradient(90deg,var(--ok),#6FE3B5)}
.rwc .bar i{background:linear-gradient(90deg,var(--ac),#FF7AB6)}
.bar.pf i{background:linear-gradient(90deg,#FFB347,#FFD166)}
.bar.pj i{background:linear-gradient(90deg,#FF7AB6,#FFB3D1)}
.tk.dn{opacity:.78}
.st{transition:transform .15s}.st:hover{transform:translateY(-3px)}

@keyframes pc{from{transform:translate(-50%,-50%) scale(.6);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(1.1);opacity:0}}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- poin & level ---------- */
function logP(p,w){S.pl.push({d:TD(),w,p});if(S.pl.length>40)S.pl=S.pl.slice(-40)}
function gain(p,w){const o=lvOf(S.xp);S.pts+=p;S.xp+=p;logP(p,w);const n=lvOf(S.xp);if(n>o)setTimeout(()=>{toast('🎊 Level up! Kamu sekarang Lv '+n+' · '+LVT(n),1);burst(null,'🎊🎉⭐🌟',24)},500)}
function spend(p,w){S.pts=Math.max(0,S.pts-p);logP(-p,w)}
function undo(p,w){S.pts=Math.max(0,S.pts-p);S.xp=Math.max(0,S.xp-p);logP(-p,w)}
function setSt(T,v,el){const was=T.st==='selesai';T.st=v;T.doneAt=v==='selesai'?TD():null;
  if(v==='selesai'&&!was)taskDone(T,el);else if(v!=='selesai'&&was&&T.rw){undo(T.rw,'Batal selesai: '+T.t);T.rw=0}}
function taskDone(T,el){if(T.rw)return;const p=ptsOf(T)+((T.due||TD())>=TD()?5:0);T.rw=p;gain(p,'Selesai: '+T.t);
  if(S.pet)petPlus(Math.round(p/2),6);

const lvB=()=>{const L=X.k==='sd'?SD_LV:LV;return `<div class="tabs">${L.map((l,i)=>`<button class="b ${X.lv===i+1?'':'s'} sm" data-g="lv" data-v="${i+1}">${l}</button>`).join('')}</div>`};
const fmB=()=>`<div class="tabs">${[[9,'9 kotak (3 kolom)'],[12,'12 kotak (4 kolom)']].map(([n,l])=>`<button class="b ${X.fm===n?'':'s'} sm" data-g="fm" data-v="${n}">${l}</button>`).join('')}</div>`;
const top=t=>`<div class="f" style="flex-wrap:nowrap"><button class="b s sm n" data-g="x">← Tutup</button><b style="flex:1;text-align:center">${t}</b></div>`;
/* ---------- poin game: tanpa batas harian ---------- */
function win(n,pts){const d=TD();S.gl.push({d,g:n,r:100});if(S.gl.length>800)S.gl=S.gl.slice(-800);
 const p=Math.max(0,Math.round(pts));if(p>0)gain(p,'Game: '+n);
 try{petPlus(8,10)}catch(e){}sv();toast('🎉 Selesai! +'+p+' poin',1);return p}
/* ---------- SUDOKU: 1 papan 9×9 (baris, kolom, blok 3×3 saling nyambung, angka 1–9 tanpa kembar) ---------- */
function sdFull(){const b=sh([1,2,3,4,5,6,7,8,9]),pat=(r,c)=>(3*(r%3)+Math.floor(r/3)+c)%9,rs=[],cs=[];sh([0,1,2]).forEach(x=>sh([0,1,2]).forEach(y=>rs.push(x*3+y)));sh([0,1,2]).forEach(x=>sh([0,1,2]).forEach(y=>cs.push(x*3+y)));const g=[];for(const r of rs)for(const c of cs)g.push(b[pat(r,c)]);return g}
function sdCount(a,lim){let n=0;const rec=()=>{let bi=-1,bc=null,bn=10;for(let i=0;i<81;i++){if(a[i])continue;const r=Math.floor(i/9),c=i%9,u=new Set();for(let k=0;k<9;k++){u.add(a[r*9+k]);u.add(a[k*9+c])}const r0=r-r%3,c0=c-c%3;for(let y=0;y<3;y++)for(let x=0;x<3;x++)u.add(a[(r0+y)*9+c0+x]);const cd=[];for(let v=1;v<=9;v++)if(!u.has(v))cd.push(v);if(cd.length<bn){bn=cd.length;bi=i;bc=cd;if(bn<=1)break}}
 if(bi<0){n++;return n>=lim}if(!bn)return false;for(const v of bc){a[bi]=v;if(rec()){a[bi]=0;return true}}a[bi]=0;return false};rec();return n}
function sdGen(lv){lv=lv||1;const sol=sdFull(),cur=sol.slice(),tg=SD_CL[lv-1]||36;let clues=81;for(const i of sh([...Array(81).keys()])){if(clues<=tg)break;const v=cur[i];cur[i]=0;if(sdCount(cur.slice(),2)!==1)cur[i]=v;else clues--}
 return{W:9,sol,cur,fx:cur.map(v=>v>0),sel:-1,won:0,lv,hints:0,hh:{}}}
const _sdGen=sdGen;sdGen=function(lv){let r;for(let i=0;i<8;i++){r=_sdGen(lv);if(r.cur.filter(v=>v>0).length===SD_CL[(lv||1)-1])break}return r};
const sdBad=(a,i)=>{const v=a[i];if(!v)return false;const r=Math.floor(i/9),c=i%9;for(let k=0;k<81;k++){if(k===i||a[k]!==v)continue;const r2=Math.floor(k/9),c2=k%9;if(r2===r||c2===c||(Math.floor(r2/3)===Math.floor(r/3)&&Math.floor(c2/3)===Math.floor(c/3)))return true}return false};
function sdDraw(){const q=X.s;let g='';for(let i=0;i<81;i++){const r=Math.floor(i/9),c=i%9,bad=sdBad(q.cur,i);g+=`<button class="sc${q.fx[i]?' fx':''}${q.sel===i?' sl':''}${q.hh&&q.hh[i]?' hn':''}${bad?' bd':''}${c%3===2&&c<8?' bR':''}${r%3===2&&r<8?' bB':''}" data-g="c" data-i="${i}">${q.cur[i]||''}</button>`}
 ov(top('🔲 Sudoku · '+SD_LV[q.lv-1])+`<p class="mu" style="margin:6px 0 0">Isi semua kotak kosong dengan angka 1–9. Tiap baris, kolom, dan blok 3×3 tidak boleh ada angka kembar.</p><div class="sg s9">${g}</div><div class="tabs" style="justify-content:center">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="b s sm" data-g="n" data-v="${n}">${n}</button>`).join('')}<button class="b s sm" data-g="n" data-v="0">⌫</button></div><div class="tabs"><button class="b sm" data-g="chk">✓ Cek</button><button class="b s sm" data-g="hint">💡 Bantuan</button><button class="b s sm" data-g="new">🔄 Baru</button><button class="b s sm" data-g="lvm">⚙️ Level</button></div><p class="mu" id="gxm" style="margin:0">Pilih kotak kosong lalu ketuk 💡 Bantuan untuk melihat angka yang benar. Angka kembar ditandai merah. Poin: ${SD_PTS[q.lv-1]} (tanpa batas harian). Bantuan terpakai: ${q.hints}.</p>`)}
/* ---------- DERET TABEL: 9 kotak (3×3) atau 12 kotak (3×4), pola tiap baris & kolom konsisten ---------- */
const A={add(n){const d=rn(1,6)*(rn(0,1)?1:-1),x=d>0?rn(1,9):rn(18,30);return[...Array(n)].map((_,i)=>x+d*i)},
 mul(n,mx){const m=rn(2,mx||3),x=rn(1,3);return[...Array(n)].map((_,i)=>x*m**i)},
 div(n,mx){const m=rn(2,mx||3),x=rn(1,2);return[...Array(n)].map((_,i)=>x*m**(n-1-i))},
 sq(n,d){const x=rn(1,6);return[...Array(n)].map((_,i)=>(x+d*i)**2)},
 tri(n){const d=rn(1,3),x=rn(1,9);return[...Array(n)].map((_,i)=>x+d*i*(i+1)/2)}};
const dsc=v=>{const d=v.slice(1).map((x,i)=>x-v[i]);
 if(d.every(x=>x===d[0]))return d[0]>=0?'+'+d[0]:'−'+(-d[0]);
 if(v.every(x=>x>0)){const r=v[1]/v[0];if(v.every((x,i)=>!i||Math.abs(x/v[i-1]-r)<1e-9))return r>=1?'×'+r:'÷'+(+(1/r).toFixed(2))}
 const e=d.slice(1).map((x,i)=>x-d[i]);
 if(e.length&&e.every(x=>x===e[0]))return 'selisih '+(e[0]>0?'bertambah '+e[0]:'berkurang '+(-e[0]))+' tiap langkah';
 if(d.every(x=>x!==0)){const q=d.slice(1).map((x,i)=>x/d[i]);if(q.length&&q.every(x=>Math.abs(x-q[0])<1e-9))return 'selisih '+(q[0]>=1?'dikali '+q[0]:'dibagi '+(+(1/q[0]).toFixed(2)))}
 return 'pola khusus'};
const dl=(L,nm)=>{const t=L.map(dsc);return t.every(x=>x===t[0])?t[0]:t.map((x,i)=>nm+' '+(i+1)+': '+x).join('; ')};
function dtGrid(lv,C){const R=3,cell=f=>[...Array(R)].map((_,r)=>[...Array(C)].map((_,c)=>f(r,c)));
 const S1=(F,G)=>({a:cell((r,c)=>F[c]+G[r])}),P1=(F,G)=>({a:cell((r,c)=>F[c]*G[r])});
 const fib=()=>{const p=rn(1,5),q=rn(1,5),e=rn(1,3),f=rn(1,3),a=cell((r,c)=>c===0?p+e*r:c===1?q+f*r:0);a.forEach(x=>{for(let c=2;c<C;c++)x[c]=x[c-1]+x[c-2]});return{a,row:'tiap angka (mulai kotak ke-3) = jumlah dua angka sebelumnya'}};
 const aff=()=>{const x0=rn(1,5),e=rn(1,3),k=rn(2,3),j=rn(0,3),a=cell((r,c)=>c===0?x0+e*r:0);a.forEach(x=>{for(let c=1;c<C;c++)x[c]=x[c-1]*k+j});return{a,row:'tiap angka = angka sebelumnya ×'+k+(j?' +'+j:'')}};
 const sq2=()=>{const p=rn(1,4),dr=rn(1,3),dc=rn(1,3);return{a:cell((r,c)=>(p+dr*r+dc*c)**2)}};
 const O={1:[()=>S1(A.add(C),A.add(R)),()=>S1(A.add(C),A.add(R)),()=>P1(A.mul(C,2),A.mul(R,2))],
  2:[()=>S1(A.add(C),A.mul(R)),()=>S1(A.mul(C),A.add(R)),()=>P1(A.mul(C,3),A.mul(R,2)),()=>S1(A.add(C),A.div(R)),()=>P1(A.div(C,2),A.mul(R,2))],
  3:[()=>S1(A.sq(C,1),A.add(R)),()=>S1(A.add(C),A.sq(R,1)),()=>S1(A.tri(C),A.add(R)),()=>S1(A.add(C),A.tri(R)),fib,()=>S1(A.mul(C),A.tri(R))],
  4:[sq2,()=>S1(A.sq(C,rn(1,2)),A.sq(R,1)),()=>S1(A.tri(C),A.sq(R,1)),aff,()=>S1(A.sq(C,2),A.tri(R)),()=>P1(A.mul(C,2),A.tri(R)),fib]}[lv];
 for(let t=0;t<400;t++){const g=O[rn(0,O.length-1)](),f=g.a.flat();
  if(f.every(x=>Number.isInteger(x)&&x>=1&&x<=999)&&new Set(f).size>=Math.ceil(f.length*.7)){
   const cols=[...Array(C)].map((_,c)=>g.a.map(r=>r[c]));
   g.rule='Baris: '+(g.row||dl(g.a,'baris'))+' · Kolom: '+dl(cols,'kolom');return g}}
 return fib()}
function dtBlanks(C,lv){const hard=lv>=3,n=C===3?(hard?3:2):(hard?4:3),cols=sh([...Array(C).keys()]).slice(0,n);let rws;
 if(C===3)rws=sh([0,1,2]).slice(0,n);else if(!hard)rws=sh([0,1,2]);else{const t=sh([0,1,2]).slice(0,2);rws=sh([t[0],t[0],t[1],t[1]])}
 const bl=[new Set(),new Set(),new Set()];cols.forEach((c,i)=>bl[rws[i]].add(c));return bl}
function dtGen(lv,fm){const C=fm===12?4:3,g=dtGrid(lv,C),bl=dtBlanks(C,lv);
 return{rows:g.a.map((a,i)=>({a,bl:bl[i],v:a.map(()=>'')})),lv,cols:C,rule:g.rule,won:0,show:0}}
function dtDraw(chk){const q=X.t;let g='';q.rows.forEach((r,i)=>r.a.forEach((n,j)=>{g+=r.bl.has(j)?`<input class="dc ${chk?(r.v[j]!==''&&+r.v[j]===n?'ok':'no'):''}" inputmode="numeric" data-g="v" data-r="${i}" data-c="${j}" value="${r.v[j]}" aria-label="Baris ${i+1} kolom ${j+1}">`:`<b class="dc">${n}</b>`}));
 ov(top('📊 Deret Tabel · '+LV[q.lv-1]+' · '+q.rows.length*q.cols+' kotak')+`<p class="mu" style="margin:6px 0 0">Tiap baris dan tiap kolom punya pola yang konsisten (tambah, kurang, kali, bagi, atau kuadrat). Temukan polanya lalu isi kotak kosong.</p><div class="dtg" style="grid-template-columns:repeat(${q.cols},1fr)">${g}</div>${q.show?`<div class="dtn">💡 <b>Pola soal ini</b><br>${String(q.rule).split(' · ').map(x=>'• '+x).join('<br>')}</div>`:''}<div class="tabs"><button class="b sm" data-g="chk">✓ Periksa</button><button class="b s sm" data-g="pat">${q.show?'🙈 Sembunyikan pola':'👁 Lihat pola'}</button><button class="b s sm" data-g="new">🔄 Baru</button></div><p class="mu" id="gxm" style="margin:0">Poin: ${DT_PTS[q.lv-1]} (tanpa batas harian).</p>`)}
function gxOpen(k){X={k,lv:1,fm:9,scr:'menu'};gxMenu()}
function gxMenu(){const sd=X.k==='sd',n=sd?'🔲 Sudoku':'📊 Deret Tabel';ov(top(n)+`<p class="mu">${sd?'Isi kotak 9×9 dengan angka 1–9 tanpa kembar. Mudah = 18 kotak kosong, Sedang = 24, Sulit = 36. Ada tombol 💡 Bantuan untuk melihat angka yang benar.':'Tiap baris dan kolom mengikuti pola yang konsisten. Isi angka yang kosong.'}</p><p><b>Pilih level</b></p>${lvB()}${sd?'':'<p><b>Bentuk tabel</b></p>'+fmB()}<p class="mu">Poin: ${(sd?SD_PTS:DT_PTS).join(' / ')} sesuai level · tanpa batas poin harian.</p><button class="b" data-g="go">▶️ Mulai</button>`)}
const oo=window.openGame;window.openGame=function(k){if(k==='sd'||k==='dt')return gxOpen(k);return oo(k)};
document.addEventListener('click',e=>{const b=e.target.closest('#gx [data-g]');if(!b)return;const a=b.dataset.g,v=+b.dataset.v;
 if(a==='x'){document.getElementById('gx').remove();return}
 if(a==='lv'){X.lv=v;gxMenu();return}
 if(a==='fm'){X.fm=v;gxMenu();return}
 if(a==='go'||a==='new'){if(X.k==='sd'){X.s=sdGen(X.lv);sdDraw()}else{X.t=dtGen(X.lv,X.fm);dtDraw()}return}
 if(a==='lvm'){gxMenu();return}
 if(a==='pat'&&X.k==='dt'&&X.t){X.t.show=!X.t.show;dtDraw(false);return}
 if(a==='hint'&&X.k==='sd'){const q=X.s,m=document.getElementById('gxm');if(q.sel<0){m.textContent='Pilih dulu kotak yang ingin kamu ketahui jawabannya.';return}if(q.fx[q.sel]){m.textContent='Kotak itu sudah berisi angka dari soal. Pilih kotak yang kosong.';return}
  const i=q.sel,ans=q.sol[i],r=Math.floor(i/9)+1,c=i%9+1,ok=q.cur[i]===ans;if(!ok){q.cur[i]=ans;q.hh[i]=1;q.hints++}
  sdDraw();const m2=document.getElementById('gxm');m2.textContent=ok?'✅ Angka di baris '+r+', kolom '+c+' sudah benar ('+ans+').':'💡 Angka yang benar di baris '+r+', kolom '+c+' adalah '+ans+'. Sudah kuisikan untukmu.';return}
 if(a==='c'){X.s.sel=+b.dataset.i;sdDraw();return}
 if(a==='n'){const q=X.s;if(q.sel<0||q.fx[q.sel])return;q.cur[q.sel]=v;sdDraw();return}
 if(a==='chk'){
  if(X.k==='sd'){const q=X.s,m=document.getElementById('gxm'),full=q.cur.every(x=>x),bad=q.cur.some((_,i)=>sdBad(q.cur,i));
   if(!full)m.textContent='Masih ada kotak kosong.';else if(bad)m.textContent='Ada angka kembar, periksa kotak merah.';
   else if(q.won)m.textContent='🎉 Sudah benar! Tekan Baru untuk soal lain.';
   else{q.won=1;const p=win('Sudoku '+SD_LV[q.lv-1],SD_PTS[q.lv-1]);m.textContent='🎉 Benar semua! '+('+'+p+' poin')}}
  else{const q=X.t,ok=q.rows.every(r=>[...r.bl].every(j=>+r.v[j]===r.a[j]&&r.v[j]!=='')),first=ok&&!q.won;let p=0;
   if(first){q.won=1;p=win('Deret Tabel '+LV[q.lv-1],DT_PTS[q.lv-1])}
   q.show=q.show||ok;dtDraw(true);const m=document.getElementById('gxm');
   m.textContent=ok?(first?'🎉 Semua benar! '+('+'+p+' poin'):'🎉 Sudah benar! Tekan Baru untuk soal lain.'):'Kotak hijau benar, merah perlu dicek.'}}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.g==='v'&&X.t&&X.t.rows[+t.dataset.r]){X.t.rows[+t.dataset.r].v[+t.dataset.c]=t.value}});
})();

<script>
/* ===== v12: Kalender (klik tanggal → jadwal hari itu + tugas baru, terhubung ke Tugas & Tahunan) · jadwal ringkas di Tugas ===== */
(()=>{
const E=esc,hmNow=()=>{const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')};

/* Form tugas baru di kalender */

 const nm=cm.toLocaleDateString('id-ID',{month:'long'});let mn=0,md=0,c=DL.map(x=>`<small>${x}</small>`).join('')+'<span></span>'.repeat(f);
 for(let i=1;i<=n;i++){const d=iso(new Date(y,m,i)),x=map[d]||{n:0,d:0,h:0};mn+=x.n;md+=x.d;const lv=x.n?x.n>=8?4:x.n>=5?3:x.n>=3?2:1:0,lb=i+' '+nm+' '+y+': '+(x.n?x.n+' tugas, '+x.d+' selesai':'kosong')+(gd[d]?' · deadline goal':'')+(gDn(d)?' · goal selesai':'');
  c+=`<button class="yd ${lv?'ht'+lv:''} ${d===T?'td':''} ${d===cs?'sl':''} ${x.n&&x.d===x.n?'ok':''}${gDn(d)?' gdn':''}" data-a="cd" data-d="${d}" title="${esc(lb)}" aria-label="${esc(lb)}">${i}${x.h?'<i class="hi"></i>':''}${gd[d]?'<i class="gi"></i>':''}</button>`}
 const ts=S.tasks.filter(t=>(t.due||T)===cs).sort(byTime),dn=ts.filter(t=>t.st==='selesai').length,dg=gd[cs]||[];

<script>
/* ===== v16 · ikon petunjuk, tombol Chat Admin di sidebar ===== */
(()=>{
const HS=new Map();let hn=0,pop=null,cur=null;
const SKIP='#lgn,#cx,#adm,#dw,.cx,#hintpop';
const KEEP=/^(Tidak ada|Belum ada|Belum punya|Goal ini belum|Folder ini masih|Hebat!|Sudah di jalur|Realisasi masih)/;
function okP(p){
  if(p.closest(SKIP)||p.dataset.keep!==undefined||p.id)return false;
  if(p.querySelector('[id],input,button,select,textarea,a,canvas,svg'))return false;
  const t=p.textContent.trim();
  if(t.length<45||t.split(/\s+/).length<7)return false;
  if(KEEP.test(t)||/^\d/.test(t))return false;
  if(/^\p{Extended_Pictographic}/u.test(t)&&t.includes(' · '))return false;
  return true}
function mkHint(html,solo){const b=document.createElement('span');b.className='hint'+(solo?' solo':'');b.tabIndex=0;b.setAttribute('role','button');b.setAttribute('aria-label','Petunjuk');b.title='Petunjuk';const id='h'+(++hn);b.dataset.h=id;HS.set(id,html);return b}
function conv(root){
  if(!root)return;
  root.querySelectorAll('p.mu').forEach(p=>{
    if(!okP(p))return;
    const card=p.closest('details.c,.c');let h=null;
    if(card)h=[...card.children].find(x=>/^(H1|H2|H3|SUMMARY)$/.test(x.tagName))||null;
    else{const pv=p.previousElementSibling;if(pv&&/^H[123]$/.test(pv.tagName))h=pv}
    const html=p.innerHTML;
    if(h){let b=h.querySelector(':scope>.hint');if(b)HS.set(b.dataset.h,HS.get(b.dataset.h)+'<br><br>'+html);else h.appendChild(mkHint(html));p.remove()}
    else p.replaceWith(mkHint(html,true))});
  root.querySelectorAll('.trmh>span.mu').forEach(sp=>{const t=sp.textContent.trim();if(/^Ketuk satu tanda/.test(t)){const h=sp.parentElement.querySelector('b');if(h){h.appendChild(mkHint(sp.innerHTML));sp.remove()}}});
  if(HS.size>300){const live=new Set([...document.querySelectorAll('.hint')].map(x=>x.dataset.h));[...HS.keys()].forEach(k=>{if(!live.has(k))HS.delete(k)})}}
function show(b){hide();const t=HS.get(b.dataset.h);if(!t)return;pop=document.createElement('div');pop.id='hintpop';pop.setAttribute('role','tooltip');pop.innerHTML=t;document.body.appendChild(pop);cur=b;
  const r=b.getBoundingClientRect(),w=pop.offsetWidth,hh=pop.offsetHeight;let x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8),y=r.bottom+6;if(y+hh>innerHeight-8)y=Math.max(8,r.top-hh-6);pop.style.left=x+'px';pop.style.top=y+'px'}
function hide(){if(pop){pop.remove();pop=null;cur=null}}
document.addEventListener('click',e=>{
  const b=e.target.closest('.hint');
  if(b){e.preventDefault();e.stopPropagation();cur===b?hide():show(b);return}
  const c=e.target.closest('[data-v16="chat"]');
  if(c){hide();try{window.FN.support()}catch(x){}return}
  if(pop&&!e.target.closest('#hintpop'))hide()},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')hide();
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('hint')){e.preventDefault();cur===e.target?hide():show(e.target)}});
window.addEventListener('scroll',hide,true);window.addEventListener('resize',hide);
window.__hint=h=>mkHint(h).outerHTML;
function chatBtn(){return;
  const s=document.getElementById('side'),F=window.FN;
  if(!s||!F||!F.support||F.isAdmin||s.querySelector('.chbtn'))return;
  const b=document.createElement('button');b.className='chbtn';b.type='button';b.dataset.v16='chat';b.setAttribute('aria-label','Chat privat ke admin');
  b.innerHTML='<span>💬</span>Chat Admin<i class="cdot"'+(F.unreadChat?'':' hidden')+'></i>';
  const st=s.querySelector('button[data-k="set"]');st?st.before(b):s.appendChild(b)}
function polish(){conv(document.getElementById('app'));conv(document.getElementById('dr'));chatBtn()}
const _r16=render;render=function(){const r=_r16.apply(this,arguments);try{hide();polish()}catch(e){console.warn('[v16]',e)}return r};
let tmr=null;const mo=new MutationObserver(()=>{clearTimeout(tmr);tmr=setTimeout(()=>{try{polish()}catch(e){}},40)});
['app','dr','side'].forEach(id=>{const e=document.getElementById(id);if(e)mo.observe(e,{childList:true,subtree:true})});
polish()})();
</script>

/* keamanan: lampiran chat hanya boleh berupa data: URL (cegah link javascript:/http dari dokumen yang dimanipulasi) */

};

/* Kartu layar penuh (gerbang member, error, dll) */
const CARD = 'max-width:420px;width:100%;background:#fff;color:#1f2937;border-radius:16px;padding:26px;box-shadow:0 10px 40px rgba(0,0,0,.12);text-align:center';
function blkHost() {

  let b = document.getElementById('blk');

  return b;
}
const btnCss = p => 'display:block;width:100%;margin:8px 0 0;padding:12px;border-radius:10px;border:' + (p ? '0' : '1px solid #cbd5e1') + ';background:' + (p ? '#4f46e5' : '#fff') + ';color:' + (p ? '#fff' : '#1f2937') + ';font-size:15px;cursor:pointer';
function showBlock(title, body, buttons, icon, sub) {
  const b = blkHost();
  b.innerHTML = '<div style="' + CARD + '"><div style="font-size:40px">' + (icon || '🔒') + '</div><h2 style="margin:8px 0 6px;font-size:20px">' + E2(title) + '</h2>' +
    '<p style="margin:0 0 6px;line-height:1.5;color:#4b5563">' + E2(body) + '</p>' + (sub ? '<p style="margin:0 0 14px;font-size:13px;color:#6b7280;word-break:break-all">' + E2(sub) + '</p>' : '<div style="height:12px"></div>') +
    buttons.map((x, i) => '<button data-i="' + i + '" style="' + btnCss(x.primary) + '">' + E2(x.label) + '</button>').join('') + '</div>';
  b.querySelectorAll('button').forEach(el => el.addEventListener('click', () => buttons[+el.dataset.i].fn()));
}
/* data dianggap "ada isinya" bila ada salah satu dari ini → tidak boleh tertimpa data kosong */
const hasData = s => !!((s.tasks || []).length || (s.goals || []).length || (s.plan || []).length || (s.focus || []).length || (s.notes || []).length || (s.rt || []).length || (s.al || []).length || (s.fc || []).length || Object.keys(s.mood || {}).length || Object.keys(s.dn || {}).length || (s.pts || 0) > 0 || (s.xp || 0) > 0 || s.pet || (s.set && s.set.name));

(async () => {
  let resolved = false;
  const failOpen = (why, e) => { console.warn('[FocusNest] ' + why); if (e) console.error(e); showBlock('Aplikasi belum bisa dimuat', 'Koneksi lambat atau bermasalah. Muat ulang halaman untuk mencoba lagi.', [{ label: 'Muat ulang', primary: true, fn: () => location.reload() }], '⚠️'); };

  if (!firebaseConfig.apiKey || firebaseConfig.apiKey === 'YOUR_API_KEY') { failOpen('firebaseConfig belum diisi.'); return; }
  setTimeout(() => { if (!resolved) failOpen('Firebase terlalu lama dimuat.'); }, 12000);

  try {
    const [{ initializeApp }, A, F0] = await Promise.all([
      import(G + 'firebase-app.js'), import(G + 'firebase-auth.js'), import(G + 'firebase-firestore.js')
    ]);

    /* ================= PELACAK PENGGUNAAN =================
       Menghitung write yang dikirim aplikasi per hari, durasi akses, dan ukuran data tiap user.
       Disimpan di usage/{email} (dikirim digabung & dibatasi, bukan tiap write) → hemat kuota 20.000 write/hari. */
    const F = { ...F0 };
    const U = { email: '', p: {}, size: 0, lastFlush: 0, tick: 0, denied: false, on: false, busy: false };
    const uFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit' });
    const uDay = ts => uFmt.format(new Date(ts));   // hari kuota Firebase = tengah malam waktu Pasifik
    const UK = 'focusnest_usage';
    const uSave = () => { try { localStorage.setItem(UK, JSON.stringify({ e: U.email, p: U.p, s: U.size })); } catch (e) {} };
    const uAdd = (k, n) => { if (!U.on) return; const d = uDay(Date.now()), x = U.p[d] || (U.p[d] = { w: 0, sec: 0 }); x[k] += n; };
    ['setDoc', 'addDoc', 'updateDoc', 'deleteDoc'].forEach(k => { if (typeof F0[k] === 'function') F[k] = (...a) => { const p = F0[k](...a); Promise.resolve(p).then(() => uAdd('w', 1), () => {}); return p; }; });

    async function flushUsage(force) {
      if (!U.on || U.denied || U.busy) return;
      const now = Date.now(); if (!force && now - U.lastFlush < 300000) return;
      const snap = U.p; U.p = {}; U.busy = true; U.lastFlush = now; uSave();
      const w = {}, sec = {}; let tw = 0, ts = 0;
      Object.keys(snap).forEach(d => { const x = snap[d]; if (x.w) { w[d] = F0.increment(x.w); tw += x.w; } if (x.sec) { sec[d] = F0.increment(x.sec); ts += x.sec; } });
      const data = { email: U.email, last: now, size: U.size || 0, tw: F0.increment(tw), ts: F0.increment(ts) };
      if (Object.keys(w).length) data.w = w; if (Object.keys(sec).length) data.sec = sec;
      try { await F0.setDoc(F0.doc(db, 'usage', U.email), data, { merge: true }); uAdd('w', 1); }
      catch (e) {
        Object.keys(snap).forEach(d => { const x = U.p[d] || (U.p[d] = { w: 0, sec: 0 }); x.w += snap[d].w; x.sec += snap[d].sec; });   // kembalikan, kirim lagi nanti
        if (e && e.code === 'permission-denied') { U.denied = true; console.warn('[FocusNest] usage: Rules menolak. Tambahkan aturan untuk usage/{email}.'); }
      }
      U.busy = false; uSave();
    }
    function usageInit(user) {
      const em = (user.email || '').toLowerCase(); if (!em || U.on) return;
      U.email = em; U.on = true;
      try {
        const r = JSON.parse(localStorage.getItem(UK) || 'null');
        if (r && r.e === em) { U.size = +r.s || 0; Object.keys(r.p || {}).forEach(d => { const x = U.p[d] || (U.p[d] = { w: 0, sec: 0 }); x.w += +r.p[d].w || 0; x.sec += +r.p[d].sec || 0; }); }
      } catch (e) {}
      U.tick = Date.now();
      setInterval(() => {
        const now = Date.now(), dt = Math.min(30000, now - U.tick); U.tick = now;
        if (document.visibilityState === 'visible') uAdd('sec', Math.round(dt / 1000));
        uSave(); if (now - U.lastFlush >= 900000) flushUsage(false);
      }, 15000);
      document.addEventListener('visibilitychange', () => { U.tick = Date.now(); if (document.visibilityState === 'hidden') flushUsage(false); });
      window.addEventListener('pagehide', () => { uSave(); flushUsage(false); });
      setTimeout(() => flushUsage(true), 4000);       // catat waktu akses saat sesi dimulai
    }
    const app = initializeApp(firebaseConfig), auth = A.getAuth(app);
    let db;
    try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch (e) { db = F.getFirestore(app); }

    /* ================= SINKRON DATA (aman: tidak pernah menimpa cloud dengan data kosong) ================= */
    let ref = null, ready = false, dead = false, started = false, timer = null, inflight = 0, failed = false, warned = false, last = Promise.resolve();

    function push() {
      if (dead || !ref) return Promise.resolve();
      clearTimeout(timer); timer = null;
      const S = FN.get(), json = JSON.stringify(S); U.size = json.length;
      if (json.length > 800000) FN.toast('⚠️ Data hampir penuh (' + Math.round(json.length / 1024) + ' KB). Hapus catatan/tugas lama yang selesai.');
      inflight++;
      last = F.setDoc(ref, { userId: ref.id, state: json, clientTs: S.ts || Date.now(), updatedAt: F.serverTimestamp() })
        .then(() => { failed = false; warned = false; FN.lastSync = Date.now(); FN.syncErr = ''; })
        .catch(e => { failed = true; console.error('[FocusNest] Gagal simpan ke Firestore:', e); FN.syncErr = (e && (e.code || e.message)) || 'error';
          if (!warned) { warned = true; FN.toast('Gagal sinkron ke cloud ☁️ (data tetap aman di perangkat, dicoba lagi otomatis)'); }
          setTimeout(() => { if (failed && !dead && ref) push(); }, 30000); })
        .finally(() => { inflight--; });
      return last;
    }

    /* Akun punya data cloud + perangkat punya data lokal "tamu": pilih mana yang dipakai. Default = cloud. */
    function preferCloud() {
      if (confirm('Akun ini sudah punya data tersimpan di cloud.\n\nOK = pakai data cloud (disarankan)\nBatal = pakai data di perangkat ini')) return true;
      return !confirm('Yakin? Data di cloud akan DITIMPA data perangkat ini dan tidak bisa dikembalikan.\n\nOK = ya, timpa cloud\nBatal = tetap pakai data cloud');
    }

    async function start(user) {
      if (started) return true;
      const rf = F.doc(db, COLLECTION, user.uid);
      const owner = localStorage.getItem('focusnest_uid');          // pemilik cache lokal
      let remote = null;
      try { const snap = await F.getDoc(rf); if (snap.exists()) remote = snap.data(); }
      catch (e) { console.error('[FocusNest] Gagal ambil dari Firestore:', e); return false; }   // gagal ambil → JANGAN sinkron (cegah menimpa cloud)
      started = true; ref = rf; usageInit(user);

      if (owner && owner !== user.uid) {                            // cache milik akun lain → jangan dipakai/diunggah
        try { localStorage.removeItem('focusnest'); } catch (e) {}
        FN.apply(null);
      }
      const local = FN.get();
      let useRemote = false;
      if (remote && remote.state) {
        if (owner === user.uid) useRemote = (remote.clientTs || 0) > (local.ts || 0);   // akun yang sama: yang terbaru menang
        else if (!hasData(local)) useRemote = true;                 // perangkat kosong → selalu pakai cloud
        else useRemote = preferCloud();                             // data tamu vs data cloud
      }
      if (useRemote) {
        try { FN.apply(JSON.parse(remote.state)); }
        catch (e) { console.error('[FocusNest] Data cloud tidak terbaca:', e); started = false; ref = null; return false; }
      } else push();                                                // akun baru / data perangkat lebih baru

      try { localStorage.setItem('focusnest_uid', user.uid); } catch (e) {}
      ready = true;
      if (unExp) unExp();
      let warned2 = false;
      const sched = d => {
        clearTimeout(expT); const ex = tsNum(d.expiresAt); if (!ex) return;
        const left = ex - Date.now();
        if (!warned2 && left > 0 && left < 3 * DAY) { warned2 = true; FN.toast('⏳ Langgananmu berakhir ' + fmtD2(ex) + ' (sisa ' + Math.ceil(left / DAY) + ' hari)'); }
        expT = setTimeout(() => { if (ex > Date.now()) { sched(d); return; } push().finally(() => location.reload()); }, Math.min(Math.max(left, 0) + 500, 2e9));
      };
      unExp = F.onSnapshot(F.doc(db, 'members', (user.email || '').toLowerCase()), sn => {
        if (admPass || !sn.exists()) return; const d = sn.data();
        if (!isLive(d)) { push().finally(() => location.reload()); return; }   // dinonaktifkan / langganan habis → data disimpan lalu masuk gerbang
        sched(d);
      }, () => {});
      FN.email = user.email || user.displayName || 'akunmu';
      FN.support = () => { const em0 = (user.email || '').toLowerCase(); if (!em0 || document.getElementById('cx')) return; openChat({ email: em0, admin: false, member: true, name: user.displayName || '' }); };
      try { let un0 = 0; F.onSnapshot(F.doc(db, 'requests', (user.email || '').toLowerCase()), sn => { const d = sn.exists() ? sn.data() : {}, u = d.unreadUser === true, n = u ? Math.max(1, d.unreadUserN || 1) : 0; FN.unreadChat = u; setBadge(n); if (n && n > un0 && chatOpenFor === null) { FN.toast('💬 ' + n + ' pesan baru dari admin'); sysNotify('💬 Admin FocusNest', String(d.lastMsg || 'Pesan baru').slice(0, 120), 'chat-admin', { chat: 'admin' }); } un0 = n; }, () => {}); } catch (e) {}
      FN.queue = () => { if (!ready || dead) return; clearTimeout(timer); timer = setTimeout(push, 6000); };   // jeda sinkron cloud: 6 detik setelah perubahan terakhir (ubah angka ini bila kuota write perlu dihemat)
      FN.syncMsg = () => {
        if (failed || FN.syncErr) return '⚠️ BELUM tersimpan ke cloud (' + FN.syncErr + ') — data masih aman di perangkat ini; tekan "Simpan ke cloud sekarang"';
        if (FN.lastSync) return '☁️ tersimpan ke cloud pukul ' + new Date(FN.lastSync).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        return '☁️ cloud tersambung (belum ada perubahan yang dikirim sesi ini)';
      };
      FN.syncNow = async () => {
        FN.toast('Menyimpan ke cloud…');
        try { await push(); await last; } catch (e) {}
        FN.toast(failed ? '⚠️ Gagal simpan ke cloud: ' + (FN.syncErr || 'periksa koneksi / Firestore Rules') : '✅ Tersimpan di cloud');
        try { FN.refresh(); } catch (e) {}
      };
      FN.reset = async () => { dead = true; clearTimeout(timer); await F.deleteDoc(ref); };
      FN.logout = async () => {
        clearTimeout(timer);
        FN.toast('Menyimpan data ke cloud…');
        try { await Promise.race([flushUsage(true), new Promise(r => setTimeout(r, 3000))]); } catch (e) {}
        await push();
        await Promise.race([last, new Promise(r => setTimeout(r, 8000))]);
        if ((inflight > 0 || failed) && !confirm('Perubahan terakhir belum berhasil tersimpan ke cloud dan bisa hilang jika kamu keluar sekarang. Tetap keluar?')) return;
        dead = true;
        try { await A.signOut(auth); } catch (e) { console.error(e); }
        try { localStorage.removeItem('focusnest'); localStorage.removeItem('focusnest_uid'); } catch (e) {}
        location.reload();
      };
      const flush = () => { if (timer) push(); };
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
      window.addEventListener('pagehide', flush);
      if (user.displayName) FN.prefill(user.displayName.split(' ')[0]);
      return true;
    }

                  ft: 'Sudah punya akun? <button type="button" class="ln" data-m="login">Masuk</button>' },
      reset:    { t: 'Reset kata sandi', s: 'Masukkan email-mu, kami kirim tautan untuk membuat kata sandi baru.', b: 'Kirim tautan reset', pw: null,

    };
    const msg = (t, ok) => { const m = $q('#lgn-m'); m.textContent = t || ''; m.classList.toggle('ok', !!ok); };
    function setMode(k) {
      mode = k; const M = MODES[k];
      $q('#lgn-t').textContent = M.t; $q('#lgn-s').textContent = M.s; $q('#lgn-b').textContent = M.b; $q('#lgn-ft').innerHTML = M.ft;

      if (M.pw) $q('#lgn-p').autocomplete = M.pw;
      msg(''); $q('#lgn-e').focus();
    }
    const busy = on => { $q('#lgn-b').disabled = $q('#lgn-g').disabled = on; };
    setMode('login');

    OV.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) setMode(b.dataset.m); });
    $q('#lgn-sh').addEventListener('change', e => { $q('#lgn-p').type = e.target.checked ? 'text' : 'password'; });

      busy(true);

        else await A.signInWithEmailAndPassword(auth, em, pw);
      } catch (x) { msg(errMsg(x)); }
      finally { busy(false); }
    });

      const prov = new A.GoogleAuthProvider();
      try { await A.signInWithPopup(auth, prov); }

        if (x.code === 'auth/popup-blocked' || x.code === 'auth/operation-not-supported-in-this-environment') {

        }

      } finally { busy(false); }
    });
    A.getRedirectResult(auth).catch(x => { showForm(); msg(errMsg(x)); });

    /* ================= STATUS LOGIN ================= */
    A.onAuthStateChanged(auth, async user => {
      resolved = true;
      if (!user) { showForm(); return; }
      if (user.isAnonymous) { await A.signOut(auth); return; }       // sesi anonim versi lama → minta login

        const md = m.exists() ? m.data() : null; ok = isLive(md); gExp = (md && String(md.active) === 'true' && !ok) ? tsNum(md.expiresAt) : 0;
        if (!ok) { try { ok = (await F.getDoc(F.doc(db, 'admins', em))).exists(); admPass = ok; } catch (e2) {} }   // admin selalu boleh masuk
      } catch (e) {

      }

      let good = false;

      if (!good) { showBlock('Data belum bisa dimuat', 'Datamu aman di cloud. Cek koneksi lalu coba lagi — aplikasi sengaja tidak dibuka agar data tidak tertimpa.', [retryBtn, logoutBtn], '☁️'); return; }
      hideOV(); setupAdmin(user);
    });
  } catch (e) {

  }

<script>

  function hideAll(){if(btn)btn.hidden=true;if(card)card.hidden=true}
  function showBtn(){
    if(isStandalone())return;
    build();
    document.getElementById('pwa-bt').textContent=deferred?'Install App':'Cara Install';
    btn.hidden=false;
    /* kartu panduan: sekali saja, setelah layar login hilang */
    if(lsGet(TIP)!=='1'){
      var tries=0,iv=setInterval(function(){
        var l=document.getElementById('lgn');
        if(isStandalone()||(!deferred&&!isIOS)){clearInterval(iv);return}
        if(!l||l.hidden){clearInterval(iv);setTimeout(function(){if(!isStandalone()&&btn&&!btn.hidden&&lsGet(TIP)!=='1')openCard()},1500)}
        else if(++tries>120)clearInterval(iv);
      },1000);
    }
  }

  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();deferred=e;showBtn();
  });
  window.addEventListener('appinstalled',function(){
    deferred=null;lsSet(TIP,'1');hideAll();say('FocusNest sudah terpasang ✅');
  });
  try{matchMedia('(display-mode: standalone)').addEventListener('change',function(e){if(e.matches)hideAll()})}catch(e){}

  /* iPhone/iPad (Safari tidak punya tombol install otomatis) → tampilkan panduan manual */
  if(isIOS&&!isStandalone()){
    window.addEventListener('load',function(){if(!deferred&&!isStandalone())showBtn()});
  }
})();
</script>

<script>
/* ===== v16: pengingat kustom + pengingat latar belakang ===== */
(()=>{
const fL=m=>{m=+m;return m%1440===0?(m/1440)+' hari':m%60===0?(m/60)+' jam':m+' mnt'};
function ask(sel){const o=document.createElement('div');o.id='rmask';o.setAttribute('style','position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px');
 o.innerHTML='<div class="c" style="max-width:340px;width:100%;margin:0"><h2>🔔 Atur pengingat sendiri</h2><p class="mu">Ingatkan berapa lama sebelum jadwal?</p><div class="f"><input id="rmaN" type="number" min="1" value="30" style="flex:1 1 90px" aria-label="Jumlah"><select id="rmaU" style="flex:1 1 100px" aria-label="Satuan"><option value="1">menit</option><option value="60">jam</option><option value="1440">hari</option></select></div><p id="rmaE" class="mu" style="color:var(--rd);min-height:1.2em;margin:4px 0"></p><div class="f" style="justify-content:flex-end"><button class="b s n" id="rmaC">Batal</button><button class="b n" id="rmaS">Simpan</button></div></div>';
 document.body.appendChild(o);
 o.querySelector('#rmaC').onclick=()=>{const d=[...sel.options].find(x=>x.defaultSelected&&x.value!=='__c')||sel.options[0];sel.value=d.value;o.remove()};
 o.querySelector('#rmaS').onclick=()=>{const n=+o.querySelector('#rmaN').value,u=+o.querySelector('#rmaU').value,m=Math.round(n*u);if(!(n>0)||m<1||m>43200){o.querySelector('#rmaE').textContent='Isi waktu 1 menit – 30 hari.';return}
  [...sel.options].forEach(x=>{if(x.dataset.cu)x.remove()});let op=[...sel.options].find(x=>x.value===String(m));
  if(!op){op=document.createElement('option');op.value=String(m);op.dataset.cu='1';op.textContent=fL(m)+' sebelum (kustom)';sel.insertBefore(op,sel.querySelector('option[value="__c"]'))}
  sel.value=String(m);o.remove();sel.dispatchEvent(new Event('change',{bubbles:true}))};
 setTimeout(()=>{const i=o.querySelector('#rmaN');i&&i.focus()},30)}
document.addEventListener('change',e=>{const t=e.target;if(!t||t.tagName!=='SELECT'||t.value!=='__c')return;e.stopImmediatePropagation();e.preventDefault();ask(t)},true);

/* jadwal pengingat 48 jam ke depan → dikirim ke service worker */
window.__fnTest=window.__fnTest||[];
function plan(){const out=[],now=Date.now(),end=now+48*36e5,st=S.set||{};if(st.rmOn===false)return out;
 (S.tasks||[]).forEach(t=>{if(!t.time||t.st==='selesai'||t.st==='tunda'||t.rm==='off')return;const ms=new Date((t.due||TD())+'T'+t.time).getTime();if(isNaN(ms))return;
  const lead=t.rm!==undefined&&t.rm!==''?+t.rm:(+st.rmLead||0);
  if(lead>0&&ms-lead*6e4>now&&ms-lead*6e4<end)out.push({tag:'a'+t.id,at:ms-lead*6e4,title:'⏳ '+fL(lead)+' lagi: '+t.t,body:'Mulai pukul '+t.time+'. Siapkan dirimu!'});
  if(ms>now&&ms<end)out.push({tag:'b'+t.id,at:ms,title:'⏰ Waktunya: '+t.t,body:'Jadwal '+t.time})});
 (S.al||[]).forEach(a=>{if(a.on===false)return;const hm=(a.time||'07:00').split(':').map(Number);for(let d=0;d<3;d++){const x=new Date();x.setDate(x.getDate()+d);if(!(a.days||[0,1,2,3,4,5,6]).includes(x.getDay()))continue;for(let k=0;k<(+a.times||1);k++){const at=new Date(x.getFullYear(),x.getMonth(),x.getDate(),hm[0],hm[1]+k*(+a.every||5)).getTime();if(at>now&&at<end)out.push({tag:'al'+a.id+'_'+k,at,title:'⏰ '+(a.t||'Alarm'),body:'Alarm '+a.time})}}});
 [['rmAmOn','rmAm','07:30','☀️ Rencanakan harimu','Yuk susun prioritas hari ini!'],['rmPmOn','rmPm','20:30','🌙 Waktunya refleksi','Catat mood & refleksi singkatmu.']].forEach(([on,k,df,ti,bd])=>{if(!st[on])return;const hm=(st[k]||df).split(':').map(Number);for(let d=0;d<3;d++){const x=new Date();const at=new Date(x.getFullYear(),x.getMonth(),x.getDate()+d,hm[0],hm[1]||0).getTime();if(at>now&&at<end)out.push({tag:k+d,at,title:ti,body:bd})}});
 window.__fnTest=window.__fnTest.filter(i=>i.at>now);out.push(...window.__fnTest);
 return out.sort((a,b)=>a.at-b.at).slice(0,60)}
let sig='';
async function sync(force){try{if(!('serviceWorker' in navigator))return;const items=plan(),s=JSON.stringify(items.map(i=>[i.tag,i.at,i.title]));if(!force&&s===sig)return;sig=s;
 const reg=await navigator.serviceWorker.getRegistration();if(!reg)return;const w=reg.active||reg.waiting;w&&w.postMessage({type:'fn-sched',items});
 if(!('Notification' in window)||Notification.permission!=='granted')return;
 if(window.TimestampTrigger&&reg.showNotification){const old=await reg.getNotifications({includeTriggered:false}).catch(()=>[]);old.forEach(n=>{if(n.data&&n.data.fnt)n.close()});
  for(const i of items)await reg.showNotification(i.title,{tag:i.tag,body:i.body,data:{fnt:1},showTrigger:new TimestampTrigger(i.at),requireInteraction:true,vibrate:[200,100,200]}).catch(()=>{})}
 if(reg.periodicSync)reg.periodicSync.register('fn-remind',{minInterval:15*60*1000}).catch(()=>{});
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}}
setInterval(()=>sync(),30000);setTimeout(()=>sync(true),4000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)sync(true)});
window.addEventListener('pagehide',()=>sync(true));
document.addEventListener('click',e=>{const b=e.target.closest('[data-fnbg]');if(!b)return;
 const go=()=>{window.__fnTest.push({tag:'fntest',at:Date.now()+6e4,title:'🔔 Tes pengingat',body:'Kalau ini muncul & berbunyi saat app ditutup, pengingat latar belakang berfungsi!'});sync(true);toast('Tes dijadwalkan: tutup app sekarang, notifikasi muncul ±1 menit lagi ⏳')};
 if('Notification' in window&&Notification.permission!=='granted')Notification.requestPermission().then(p=>{if(p==='granted')go();else toast('Izinkan notifikasi dulu ya')});else go()});
})();
</script>
