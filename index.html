<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FocusNest — Plan · Focus · Grow · Achieve</title>
<!-- build: v10 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4FF;--card:#fff;--ink:#1B2A4A;--mu:#6B7A99;--ln:#DCE6FA;--ac:#4F7CF0;--as:#E3ECFF;--ok:#25A57A;--wn:#E5703F;--rd:#E5484D;--yl:#F5B83D}
:root[data-t=dark]{--bg:#0E1526;--card:#18223B;--ink:#EAF0FF;--mu:#96A3C4;--ln:#2A3759;--ac:#7FA2FF;--as:#233157;--ok:#4FD1A5;--wn:#FF9566;--rd:#FF7378;--yl:#FFD166}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3{margin:0;line-height:1.2}h1{font-size:1.5rem}h2{font-size:1.1rem;margin-bottom:8px}
.mu{color:var(--mu);font-size:.88rem}
#side{position:fixed;inset:0 auto 0 0;width:196px;background:var(--card);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
#side .lg{font-weight:800;font-size:1.2rem;padding:0 8px 14px}
#side button{display:flex;gap:10px;align-items:center;background:none;color:var(--mu);text-align:left;padding:10px;border-radius:10px;border:0;font:inherit;font-weight:600;cursor:pointer}
#side button[aria-current=page]{background:var(--as);color:var(--ac)}
main{margin-left:196px;padding:22px;max-width:1000px}
.g{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.g>.c{margin:0}
.hero{background:linear-gradient(120deg,var(--as),var(--card));display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
#clk{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ac)}
.st b{display:block;font-size:1.5rem}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.b.s{background:var(--as);color:var(--ac)}.b.sm{padding:4px 9px;font-size:.82rem}.b.x{background:none;color:var(--mu);padding:4px 8px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.f>*{flex:1 1 130px}.f>.n{flex:0 0 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs .b{flex:0 0 auto}
.tk{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}.tk:last-child{border:0}
.tk input[type=checkbox]{width:20px;height:20px;flex:0 0 auto;accent-color:var(--ac);padding:0}
.tk>div{flex:1;min-width:0}.tk.dn b{text-decoration:line-through;color:var(--mu)}.tk select{width:auto}
.tk input[type=number]{width:62px}
.tag{display:inline-block;font-size:.75rem;background:var(--as);color:var(--ac);border-radius:20px;padding:0 8px;margin-right:4px}
.tag.Tinggi,.tag.Top{background:#E5484D22;color:var(--rd)}.tag.Sedang{background:#F5B83D33;color:var(--wn)}
.bar{height:8px;background:var(--ln);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.tm{font-size:4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal button{aspect-ratio:1;border:1px solid var(--ln);background:var(--bg);border-radius:10px;cursor:pointer;position:relative;padding:0}
.cal button.td{border-color:var(--ac);font-weight:800}.cal button.sl{background:var(--ac);color:#fff}
.cal button i{position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--wn)}
.cal small{color:var(--mu)}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}.bars div{flex:1;text-align:center;font-size:.72rem;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px}
.mo{display:flex;gap:8px;flex-wrap:wrap}.mo button{font-size:1.8rem;background:var(--bg);border:2px solid var(--ln);border-radius:14px;padding:6px 10px;cursor:pointer}.mo button.on{border-color:var(--ac);background:var(--as)}
.sn{display:flex;gap:8px;flex-wrap:wrap}.sn div{background:#FFF3B8;color:#4A3F00;border-radius:10px;padding:10px;width:150px;font-size:.88rem;position:relative}
.sn div:nth-child(2n){background:#CFE3FF;color:#17325E}.sn div:nth-child(3n){background:#D5F5E3;color:#15432E}
.sn button{position:absolute;top:0;right:2px;background:none;border:0;cursor:pointer;color:inherit}
#dw{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#dw.on{display:flex}#dw .tm{font-size:6rem}
.tl{display:grid;grid-template-columns:54px 1fr;gap:4px 8px}.tl span{color:var(--mu);font-variant-numeric:tabular-nums}
@media(max-width:820px){
#side{inset:auto 0 0 0;width:auto;flex-direction:row;overflow-x:auto;border:0;border-top:1px solid var(--ln);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0));z-index:10}
#side .lg{display:none}#side button{flex-direction:column;gap:0;font-size:.68rem;padding:6px 10px;flex:0 0 auto}
main{margin:0;padding:14px 12px 96px}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.tm{font-size:3.2rem}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
/* ===================== FocusNest v2 · aesthetic & fitur baru ===================== */
:root{--b1:rgba(255,184,217,.45);--b2:rgba(160,214,255,.5);--b3:rgba(196,178,255,.4);--sh:0 6px 18px rgba(79,124,240,.10)}
:root[data-t=dark]{--b1:rgba(255,115,160,.12);--b2:rgba(79,140,255,.16);--b3:rgba(140,100,255,.14);--sh:0 6px 18px rgba(0,0,0,.25)}
body{background-color:var(--bg);background-image:radial-gradient(520px 380px at 92% -4%,var(--b1),transparent 70%),radial-gradient(640px 460px at -6% 22%,var(--b2),transparent 70%),radial-gradient(560px 460px at 70% 108%,var(--b3),transparent 70%);background-attachment:fixed;min-height:100vh}
h1,h2,h3,#side .lg,.mh{font-family:"Fredoka","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h3{font-size:.98rem}
.c{box-shadow:var(--sh)}
main{position:relative;z-index:1}
#side{z-index:5;overflow-y:auto}
#side .lg{display:flex;gap:6px;align-items:center}
#side .lgt{background:linear-gradient(90deg,var(--ac),#FF7AB6);-webkit-background-clip:text;background-clip:text;color:transparent}
#side button span{display:inline-block;transition:transform .2s}
#side button:hover span{transform:scale(1.25) rotate(-8deg)}
#side button[aria-current=page]{background:linear-gradient(90deg,var(--as),transparent);box-shadow:inset 3px 0 0 var(--ac)}
#side .pt{margin-top:auto;background:linear-gradient(135deg,var(--as),var(--card));border:1px solid var(--ln);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
#side .pt .bar{margin:4px 0 0}
.hero{background:linear-gradient(120deg,var(--as),var(--card) 60%,rgba(255,184,217,.25))}
.b{box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .12s,filter .15s}
.b.x{box-shadow:none}
.b:hover{filter:brightness(1.07);transform:translateY(-1px)}
.b:active{transform:translateY(1px) scale(.97)}
.bar i{background:linear-gradient(90deg,var(--ok),#6FE3B5)}
.rwc .bar i{background:linear-gradient(90deg,var(--ac),#FF7AB6)}
.bar.pf i{background:linear-gradient(90deg,#FFB347,#FFD166)}
.bar.pj i{background:linear-gradient(90deg,#FF7AB6,#FFB3D1)}
.tk.dn{opacity:.78}
.st{transition:transform .15s}.st:hover{transform:translateY(-3px)}

/* tag prioritas & kesulitan */
button.tag{border:0;font:inherit;font-size:.75rem;cursor:pointer}
button.tag:hover{filter:brightness(.95);text-decoration:underline dotted}
.tag.Rendah{background:#25A57A22;color:var(--ok)}
.tag.df-Mudah{background:#4F7CF022;color:var(--ac)}
.tag.df-Sedang{background:#8B5CF622;color:#8B5CF6}
.tag.df-Sulit{background:#E5703F22;color:var(--wn)}
.tag.df-Expert{background:linear-gradient(90deg,#FF7AB633,#8B5CF633);color:#C2307E}
:root[data-t=dark] .tag.df-Sedang,:root[data-t=dark] .tag.gl{color:#B79CFF}
:root[data-t=dark] .tag.df-Expert{color:#FF8FC4}
.tag.pt{background:#F5B83D33;color:var(--wn);font-weight:700}
.tag.gl{background:#8B5CF622;color:#8B5CF6;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
#ppv{font-size:.8rem}

/* panduan mulai */
.guide{background:linear-gradient(135deg,var(--as),var(--card));border-style:dashed}

/* toast, konfeti */
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:22px;font-weight:600;font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center}
.toast.big{background:linear-gradient(90deg,#FF7AB6,#8B5CF6);color:#fff;font-size:1rem;padding:11px 20px}
.pc{position:fixed;pointer-events:none;z-index:60;font-size:1.3rem;transform:translate(-50%,-50%)}
@keyframes pc{from{transform:translate(-50%,-50%) scale(.6);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(1.1);opacity:0}}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(1.03,.98)}}
@keyframes sad{0%,100%{transform:rotate(-3deg) translateY(3px)}50%{transform:rotate(3deg) translateY(3px)}}
@keyframes chew{0%,100%{transform:scale(1)}50%{transform:scale(1.12,.88)}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-28px) rotate(8deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,6px) scale(.8)}50%{opacity:1}100%{opacity:0;transform:translate(8px,-14px) scale(1.2)}}
@keyframes eq{0%,100%{height:4px}50%{height:15px}}
@keyframes drift{from{transform:translateX(-12vw) translateY(0)}50%{transform:translateX(48vw) translateY(-20px)}to{transform:translateX(112vw) translateY(0)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}

/* dekor latar */
#bgd{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bgd span{position:absolute;font-size:2rem;opacity:.3}

/* kalender tahunan */
.yg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:12px}
.ym{padding:12px}.ym .bar{margin:4px 0 8px}
.mh{background:none;border:0;font-size:1.05rem;font-weight:700;color:var(--ink);cursor:pointer;padding:0;display:block;text-transform:capitalize}
.mh:hover{color:var(--ac)}
.ycal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.ycal small{font-size:.65rem;color:var(--mu)}
.yd{aspect-ratio:1;border:0;border-radius:7px;background:transparent;font-size:.72rem;cursor:pointer;position:relative;padding:0;color:var(--ink);transition:transform .1s}
.yd:hover{background:var(--as);transform:scale(1.15);z-index:2}
.ht1{background:var(--as);background:color-mix(in srgb,var(--ac) 18%,var(--card))}
.ht2{background:var(--as);background:color-mix(in srgb,var(--ac) 38%,var(--card))}
.ht3{background:var(--ac);background:color-mix(in srgb,var(--ac) 60%,var(--card))}
.ht4{background:var(--ac);background:color-mix(in srgb,var(--ac) 82%,var(--card));color:#fff}
.yd.td{outline:2px solid var(--ac);outline-offset:1px;font-weight:800}
.yd.ok{box-shadow:inset 0 0 0 2px var(--ok)}
.yd.sl{background:var(--ac);color:#fff}.yd.gdn{background:#8B5CF6!important;color:#fff!important}.yd.gdn.sl{box-shadow:0 0 0 2px var(--ac)}
.yd .hi,.yd .gi{position:absolute;top:2px;width:5px;height:5px;border-radius:50%}
.yd .hi{right:2px;background:var(--rd)}.yd .gi{left:2px;background:#A66BFF}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--mu);margin-top:12px;align-items:center}
.leg span{display:inline-flex;gap:5px;align-items:center}
.leg b{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--ln)}
.leg em{width:8px;height:8px;border-radius:50%;display:inline-block;font-style:normal}

/* laci tanggal */
#dr{display:none}#dr.on{display:block}
#dr .bk{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:40}
#dr .sh{position:fixed;right:0;top:0;bottom:0;width:min(430px,100%);background:var(--card);z-index:41;padding:18px;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:-10px 0 40px rgba(0,0,0,.25);border-left:1px solid var(--ln)}
#dr .sh h3{margin-top:6px}

/* musik */
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:12px}
.mc{position:relative;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh);transition:transform .15s,border-color .15s;color:var(--ink)}
.mc:hover{transform:translateY(-3px)}
.mc.on{border-color:var(--ac);background:linear-gradient(160deg,var(--as),var(--card))}
.mc .me{font-size:2rem;line-height:1.1}.mc .mu{display:block;font-size:.8rem}
.mc .eq{position:absolute;right:12px;top:14px}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:16px;vertical-align:middle}
.eq i{width:3px;height:5px;background:var(--ac);border-radius:2px}
.eq.sm{height:12px;margin-left:6px}
#mp{display:none;position:fixed;right:14px;bottom:14px;z-index:25;background:var(--card);border:1px solid var(--ln);border-radius:30px;padding:7px 14px;box-shadow:0 8px 24px rgba(0,0,0,.2);align-items:center;gap:10px;max-width:calc(100vw - 28px)}
#mp.on{display:flex}
#mp .me2{font-size:1.4rem}
#mp b{font-size:.82rem;white-space:nowrap}
#mp input{width:84px;padding:0;accent-color:var(--ac)}
input[type=range]{accent-color:var(--ac);padding:0}
.yt{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;margin-top:10px;background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* pet */
.ps{position:relative;height:230px;border-radius:20px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;border:1px solid var(--ln)}
.ps.sm{height:150px}
.ps::before{position:absolute;left:0;right:0;bottom:6px;text-align:center;word-spacing:18px;font-size:1.4rem;pointer-events:none;opacity:.9}
.hb-room{background:linear-gradient(#FFE9DC 0 64%,#E7C7A4 64%)}.hb-room::before{content:'🪴 🖼️ 🛋️'}
.hb-gar{background:linear-gradient(#BDE8FF 0 60%,#9BD67A 60%)}.hb-gar::before{content:'🌳 🌷 ☁️ 🌻'}
.hb-sak{background:linear-gradient(#FFE0EC 0 62%,#F7B9CF 62%)}.hb-sak::before{content:'🌸 🌸 🌸'}
.hb-bea{background:linear-gradient(#9EDCFF 0 45%,#4FC3E8 45% 62%,#F6E2A8 62%)}.hb-bea::before{content:'🌴 🐚 ⛱️'}
.hb-gal{background:linear-gradient(#1a1446,#3b2a7a)}.hb-gal::before{content:'⭐ 🪐 ✨ 🌙'}
.bub{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;color:#1B2A4A;border-radius:14px;padding:6px 12px;font-size:.78rem;font-weight:600;max-width:88%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:2}
.ps.sm .bub{display:none}
.pw{position:relative;margin-bottom:22px;transform:scale(var(--sc,1));transform-origin:bottom center;z-index:1}
.pe{display:block;font-size:5.2rem;line-height:1;background:none;border:0;padding:0;cursor:pointer;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18));transform-origin:50% 100%}
.ps.sm .pe{font-size:3.8rem}
.ps.sad .pe{filter:saturate(.55) drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.ach{position:absolute;left:50%;top:-.7rem;transform:translateX(-50%) rotate(-10deg);font-size:2.3rem;pointer-events:none}
.ps.sm .ach{font-size:1.6rem;top:-.4rem}
.acs{position:absolute;right:-1.6rem;bottom:.2rem;font-size:2rem;pointer-events:none}
.ps.sm .acs{font-size:1.3rem;right:-1.1rem}
.mbd{position:absolute;left:-1.1rem;top:0;font-size:1.3rem}
.zz{position:absolute;right:-.6rem;top:-1.6rem;font-size:1.3rem}
.shg{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.si{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink);transition:transform .15s}
.si:hover{transform:translateY(-3px)}
.si .em{font-size:1.8rem;line-height:1.2}.si.on{border-color:var(--ac);background:var(--as)}
.si .mu{font-size:.76rem}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bd{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:10px;text-align:center}
.bd .em{font-size:1.8rem}.bd.lk{filter:grayscale(1);opacity:.5}
.bd.ok{background:linear-gradient(160deg,#FFF3B8,var(--card));color:#4A3F00}
:root[data-t=dark] .bd.ok{background:linear-gradient(160deg,#4a3f12,var(--card));color:#FFE9A0}
.bd small{display:block;color:var(--mu);font-size:.72rem}
.chip{display:inline-block;background:var(--as);color:var(--ac);border:0;border-radius:20px;padding:4px 10px;font-size:.8rem;cursor:pointer;margin:2px 4px 2px 0}
.rw{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.rw>div{flex:1;min-width:0}.rw:last-child{border:0}

/* animasi (hanya jika pengguna tidak membatasi gerak) */
@media(prefers-reduced-motion:no-preference){
#app.anim>*{animation:fadeUp .45s both}
#app.anim>*:nth-child(2){animation-delay:.06s}#app.anim>*:nth-child(3){animation-delay:.12s}#app.anim>*:nth-child(n+4){animation-delay:.18s}
#bgd span{animation:drift 30s linear infinite}
#side .lg .lgi{animation:wig 3.5s ease-in-out infinite}
.tk input[type=checkbox]:checked{animation:pop .35s}
.toast{animation:tin .3s}
.pc{animation:pc 1s ease-out forwards}
#dr .bk{animation:fade .2s}#dr .sh{animation:slin .25s}
.pe{animation:bob 2.4s ease-in-out infinite}
.ps.sad .pe{animation:sad 3.2s ease-in-out infinite}
.fx-eat .pe{animation:chew .45s ease-in-out 4}
.fx-play .pe{animation:jump .55s ease-in-out 4}
.acs{animation:float 3s ease-in-out infinite}
.zz{animation:zz 2.2s ease-in-out infinite}
.eq i{animation:eq .9s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
.bar i{transition:width .5s}
}
@media(prefers-reduced-motion:reduce){.pc{display:none}}
@media(max-width:820px){
#side .pt{display:none}

function undo(p,w){S.pts=Math.max(0,S.pts-p);S.xp=Math.max(0,S.xp-p);logP(-p,w)}
function setSt(T,v,el){const was=T.st==='selesai';T.st=v;T.doneAt=v==='selesai'?TD():null;

const TPS=[
['🔒','Anti-distraksi: blokir aplikasi HP sebelum belajar',`<p>Notifikasi dan scroll singkat memecah fokus. Blokir <b>sebelum</b> mulai, jangan mengandalkan niat.</p><p><b>Stay Focused: App/Site Blocker</b> (aplikasi di HP) punya tiga cara blokir: <b>jadwal</b> (hari/jam tertentu), <b>batas pemakaian harian</b>, dan <b>batas berbasis tujuan</b> (aplikasi terbuka setelah kamu memakai aplikasi produktif cukup lama). Bisa juga memblokir situs.</p><ol><li>Pasang Stay Focused dari toko aplikasi HP dan izinkan akses yang diminta (mis. data pemakaian).</li><li>Pilih aplikasi pengganggu: media sosial, game, video pendek, chat grup.</li><li>Buat <b>jadwal blokir</b> sama dengan jam belajarmu di FocusNest (mis. 19.00–21.00).</li><li>Aktifkan, lalu mulai Pomodoro di menu Fokus.</li><li>Tambahan: HP mode senyap, taruh di ruangan lain, tutup tab yang tidak perlu.</li></ol><p class="mu">Nama menu bisa berbeda tiap versi & HP. Sebagian fitur mungkin berbayar.</p><button class="b s sm" data-a="xnav" data-k="focus">⏱️ Mulai sesi fokus</button>`],
['🧠','Kurva lupa & spaced repetition',`<p>Peneliti Hermann Ebbinghaus menemukan bahwa tanpa diulang, ingatan baru menurun paling cepat di hari-hari awal. Kuncinya: <b>ulangi tepat sebelum lupa</b>, dengan jeda yang makin lebar.</p><p><b>Jadwal contoh</b>: ulang setelah <b>1 hari → 3 hari → 7 hari → 14 hari → 30 hari</b> (angka perkiraan, sesuaikan dengan sulit-tidaknya materi).</p><ul><li>Catat tanggal pertama belajar lalu pasang tugas ulangan di FocusNest.</li><li>Materi yang sering salah diulang lebih sering. Itu cara kerja Flashcard di Mainan Otak (sistem Leitner).</li></ul><button class="b s sm" data-a="xg" data-k="fc">🃏 Buat flashcard</button>`],

function occ(r,d){if(r.on===false||d<(r.start||d)||(r.end&&d>r.end))return false;
 const g=r.goal&&gT(r.goal);if(g&&(g.fin||(g.due&&d>g.due)))return false;
 const x=new Date(d+'T12:00:00');
 if(r.rep==='day')return true;if(r.rep==='once')return r.date===d;
 if(r.rep==='month')return Math.min(+r.md||1,new Date(x.getFullYear(),x.getMonth()+1,0).getDate())===x.getDate();
 if(r.rep==='year')return !!r.date&&r.date.slice(5)===d.slice(5);
 return (r.days||ALL).includes(x.getDay())}
const mk=(r,d)=>{const g=r.goal&&gT(r.goal);return{id:uid(),t:r.t,cat:(g&&g.cat)||r.cat||'Akademik',pri:'Sedang',dif:'Sedang',gid:r.goal||'',mid:'',tj:g?'Rencana goal: '+g.t:'Kebiasaan',cl:[],due:d,time:r.time||'',rm:'',est:+r.min||0,st:'belum mulai',act:0,rid:r.id,hb:isHab(r)?1:0}};

window.expN=expN;window.gPct=function(g){if(g.fin)return 100;const ts=S.tasks.filter(t=>t.gid===g.id);
 if(g.tgt>0){const v=ts.filter(t=>t.st==='selesai').reduce((a,t)=>{const r=t.rid&&S.rt.find(x=>x.id===t.rid);return a+(r&&+r.v>0?+r.v:1)},0);return Math.min(100,Math.round(v/g.tgt*100))}
 if(!ts.length)return g.ms&&g.ms.length?Math.round(g.ms.filter(m=>m.d).length/g.ms.length*100):0;

/* ---------- poin game: tanpa batas harian ---------- */
function win(n,pts){const d=TD();S.gl.push({d,g:n,r:100});if(S.gl.length>800)S.gl=S.gl.slice(-800);

/* ---------- SUDOKU: 1 papan 9×9 (baris, kolom, blok 3×3 saling nyambung, angka 1–9 tanpa kembar) ---------- */
function sdFull(){const b=sh([1,2,3,4,5,6,7,8,9]),pat=(r,c)=>(3*(r%3)+Math.floor(r/3)+c)%9,rs=[],cs=[];sh([0,1,2]).forEach(x=>sh([0,1,2]).forEach(y=>rs.push(x*3+y)));sh([0,1,2]).forEach(x=>sh([0,1,2]).forEach(y=>cs.push(x*3+y)));const g=[];for(const r of rs)for(const c of cs)g.push(b[pat(r,c)]);return g}
function sdCount(a,lim){let n=0;const rec=()=>{let bi=-1,bc=null,bn=10;for(let i=0;i<81;i++){if(a[i])continue;const r=Math.floor(i/9),c=i%9,u=new Set();for(let k=0;k<9;k++){u.add(a[r*9+k]);u.add(a[k*9+c])}const r0=r-r%3,c0=c-c%3;for(let y=0;y<3;y++)for(let x=0;x<3;x++)u.add(a[(r0+y)*9+c0+x]);const cd=[];for(let v=1;v<=9;v++)if(!u.has(v))cd.push(v);if(cd.length<bn){bn=cd.length;bi=i;bc=cd;if(bn<=1)break}}
 if(bi<0){n++;return n>=lim}if(!bn)return false;for(const v of bc){a[bi]=v;if(rec()){a[bi]=0;return true}}a[bi]=0;return false};rec();return n}
function sdGen(lv){lv=lv||1;const sol=sdFull(),cur=sol.slice(),tg=SD_CL[lv-1]||36;let clues=81;for(const i of sh([...Array(81).keys()])){if(clues<=tg)break;const v=cur[i];cur[i]=0;if(sdCount(cur.slice(),2)!==1)cur[i]=v;else clues--}
 return{W:9,sol,cur,fx:cur.map(v=>v>0),sel:-1,won:0,lv,hints:0,hh:{}}}
const _sdGen=sdGen;sdGen=function(lv){let r;for(let i=0;i<8;i++){r=_sdGen(lv);if(r.cur.filter(v=>v>0).length===SD_CL[(lv||1)-1])break}return r};
const sdBad=(a,i)=>{const v=a[i];if(!v)return false;const r=Math.floor(i/9),c=i%9;for(let k=0;k<81;k++){if(k===i||a[k]!==v)continue;const r2=Math.floor(k/9),c2=k%9;if(r2===r||c2===c||(Math.floor(r2/3)===Math.floor(r/3)&&Math.floor(c2/3)===Math.floor(c/3)))return true}return false};
function sdDraw(){const q=X.s;let g='';for(let i=0;i<81;i++){const r=Math.floor(i/9),c=i%9,bad=sdBad(q.cur,i);g+=`<button class="sc${q.fx[i]?' fx':''}${q.sel===i?' sl':''}${q.hh&&q.hh[i]?' hn':''}${bad?' bd':''}${c%3===2&&c<8?' bR':''}${r%3===2&&r<8?' bB':''}" data-g="c" data-i="${i}">${q.cur[i]||''}</button>`}
 ov(top('🔲 Sudoku · '+SD_LV[q.lv-1])+`<p class="mu" style="margin:6px 0 0">Isi semua kotak kosong dengan angka 1–9. Tiap baris, kolom, dan blok 3×3 tidak boleh ada angka kembar.</p><div class="sg s9">${g}</div><div class="tabs" style="justify-content:center">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="b s sm" data-g="n" data-v="${n}">${n}</button>`).join('')}<button class="b s sm" data-g="n" data-v="0">⌫</button></div><div class="tabs"><button class="b sm" data-g="chk">✓ Cek</button><button class="b s sm" data-g="hint">💡 Bantuan</button><button class="b s sm" data-g="new">🔄 Baru</button><button class="b s sm" data-g="lvm">⚙️ Level</button></div><p class="mu" id="gxm" style="margin:0">Pilih kotak kosong lalu ketuk 💡 Bantuan untuk melihat angka yang benar. Angka kembar ditandai merah. Poin: ${SD_PTS[q.lv-1]} (tanpa batas harian). Bantuan terpakai: ${q.hints}.</p>`)}
/* ---------- DERET TABEL: 9 kotak (3×3) atau 12 kotak (3×4), pola tiap baris & kolom konsisten ---------- */
const A={add(n){const d=rn(1,6)*(rn(0,1)?1:-1),x=d>0?rn(1,9):rn(18,30);return[...Array(n)].map((_,i)=>x+d*i)},
 mul(n,mx){const m=rn(2,mx||3),x=rn(1,3);return[...Array(n)].map((_,i)=>x*m**i)},
 div(n,mx){const m=rn(2,mx||3),x=rn(1,2);return[...Array(n)].map((_,i)=>x*m**(n-1-i))},
 sq(n,d){const x=rn(1,6);return[...Array(n)].map((_,i)=>(x+d*i)**2)},
 tri(n){const d=rn(1,3),x=rn(1,9);return[...Array(n)].map((_,i)=>x+d*i*(i+1)/2)}};
const dsc=v=>{const d=v.slice(1).map((x,i)=>x-v[i]);
 if(d.every(x=>x===d[0]))return d[0]>=0?'+'+d[0]:'−'+(-d[0]);
 if(v.every(x=>x>0)){const r=v[1]/v[0];if(v.every((x,i)=>!i||Math.abs(x/v[i-1]-r)<1e-9))return r>=1?'×'+r:'÷'+(+(1/r).toFixed(2))}
 const e=d.slice(1).map((x,i)=>x-d[i]);
 if(e.length&&e.every(x=>x===e[0]))return 'selisih '+(e[0]>0?'bertambah '+e[0]:'berkurang '+(-e[0]))+' tiap langkah';
 if(d.every(x=>x!==0)){const q=d.slice(1).map((x,i)=>x/d[i]);if(q.length&&q.every(x=>Math.abs(x-q[0])<1e-9))return 'selisih '+(q[0]>=1?'dikali '+q[0]:'dibagi '+(+(1/q[0]).toFixed(2)))}
 return 'pola khusus'};

function dtGrid(lv,C){const R=3,cell=f=>[...Array(R)].map((_,r)=>[...Array(C)].map((_,c)=>f(r,c)));
 const S1=(F,G)=>({a:cell((r,c)=>F[c]+G[r])}),P1=(F,G)=>({a:cell((r,c)=>F[c]*G[r])});
 const fib=()=>{const p=rn(1,5),q=rn(1,5),e=rn(1,3),f=rn(1,3),a=cell((r,c)=>c===0?p+e*r:c===1?q+f*r:0);a.forEach(x=>{for(let c=2;c<C;c++)x[c]=x[c-1]+x[c-2]});return{a,row:'tiap angka (mulai kotak ke-3) = jumlah dua angka sebelumnya'}};
 const aff=()=>{const x0=rn(1,5),e=rn(1,3),k=rn(2,3),j=rn(0,3),a=cell((r,c)=>c===0?x0+e*r:0);a.forEach(x=>{for(let c=1;c<C;c++)x[c]=x[c-1]*k+j});return{a,row:'tiap angka = angka sebelumnya ×'+k+(j?' +'+j:'')}};
 const sq2=()=>{const p=rn(1,4),dr=rn(1,3),dc=rn(1,3);return{a:cell((r,c)=>(p+dr*r+dc*c)**2)}};
 const O={1:[()=>S1(A.add(C),A.add(R)),()=>S1(A.add(C),A.add(R)),()=>P1(A.mul(C,2),A.mul(R,2))],
  2:[()=>S1(A.add(C),A.mul(R)),()=>S1(A.mul(C),A.add(R)),()=>P1(A.mul(C,3),A.mul(R,2)),()=>S1(A.add(C),A.div(R)),()=>P1(A.div(C,2),A.mul(R,2))],
  3:[()=>S1(A.sq(C,1),A.add(R)),()=>S1(A.add(C),A.sq(R,1)),()=>S1(A.tri(C),A.add(R)),()=>S1(A.add(C),A.tri(R)),fib,()=>S1(A.mul(C),A.tri(R))],
  4:[sq2,()=>S1(A.sq(C,rn(1,2)),A.sq(R,1)),()=>S1(A.tri(C),A.sq(R,1)),aff,()=>S1(A.sq(C,2),A.tri(R)),()=>P1(A.mul(C,2),A.tri(R)),fib]}[lv];
 for(let t=0;t<400;t++){const g=O[rn(0,O.length-1)](),f=g.a.flat();
  if(f.every(x=>Number.isInteger(x)&&x>=1&&x<=999)&&new Set(f).size>=Math.ceil(f.length*.7)){
   const cols=[...Array(C)].map((_,c)=>g.a.map(r=>r[c]));
   g.rule='Baris: '+(g.row||dl(g.a,'baris'))+' · Kolom: '+dl(cols,'kolom');return g}}
 return fib()}
function dtBlanks(C,lv){const hard=lv>=3,n=C===3?(hard?3:2):(hard?4:3),cols=sh([...Array(C).keys()]).slice(0,n);let rws;
 if(C===3)rws=sh([0,1,2]).slice(0,n);else if(!hard)rws=sh([0,1,2]);else{const t=sh([0,1,2]).slice(0,2);rws=sh([t[0],t[0],t[1],t[1]])}
 const bl=[new Set(),new Set(),new Set()];cols.forEach((c,i)=>bl[rws[i]].add(c));return bl}
function dtGen(lv,fm){const C=fm===12?4:3,g=dtGrid(lv,C),bl=dtBlanks(C,lv);
 return{rows:g.a.map((a,i)=>({a,bl:bl[i],v:a.map(()=>'')})),lv,cols:C,rule:g.rule,won:0,show:0}}
function dtDraw(chk){const q=X.t;let g='';q.rows.forEach((r,i)=>r.a.forEach((n,j)=>{g+=r.bl.has(j)?`<input class="dc ${chk?(r.v[j]!==''&&+r.v[j]===n?'ok':'no'):''}" inputmode="numeric" data-g="v" data-r="${i}" data-c="${j}" value="${r.v[j]}" aria-label="Baris ${i+1} kolom ${j+1}">`:`<b class="dc">${n}</b>`}));
 ov(top('📊 Deret Tabel · '+LV[q.lv-1]+' · '+q.rows.length*q.cols+' kotak')+`<p class="mu" style="margin:6px 0 0">Tiap baris dan tiap kolom punya pola yang konsisten (tambah, kurang, kali, bagi, atau kuadrat). Temukan polanya lalu isi kotak kosong.</p><div class="dtg" style="grid-template-columns:repeat(${q.cols},1fr)">${g}</div>${q.show?`<div class="dtn">💡 ${q.rule}</div>`:''}<div class="tabs"><button class="b sm" data-g="chk">✓ Periksa</button><button class="b s sm" data-g="new">🔄 Baru</button></div><p class="mu" id="gxm" style="margin:0">Poin: ${DT_PTS[q.lv-1]} (tanpa batas harian).</p>`)}
function gxOpen(k){X={k,lv:1,fm:9,scr:'menu'};gxMenu()}

const oo=window.openGame;window.openGame=function(k){if(k==='sd'||k==='dt')return gxOpen(k);return oo(k)};
document.addEventListener('click',e=>{const b=e.target.closest('#gx [data-g]');if(!b)return;const a=b.dataset.g,v=+b.dataset.v;
 if(a==='x'){document.getElementById('gx').remove();return}

 if(a==='lvm'){gxMenu();return}
 if(a==='hint'&&X.k==='sd'){const q=X.s,m=document.getElementById('gxm');if(q.sel<0){m.textContent='Pilih dulu kotak yang ingin kamu ketahui jawabannya.';return}if(q.fx[q.sel]){m.textContent='Kotak itu sudah berisi angka dari soal. Pilih kotak yang kosong.';return}
  const i=q.sel,ans=q.sol[i],r=Math.floor(i/9)+1,c=i%9+1,ok=q.cur[i]===ans;if(!ok){q.cur[i]=ans;q.hh[i]=1;q.hints++}
  sdDraw();const m2=document.getElementById('gxm');m2.textContent=ok?'✅ Angka di baris '+r+', kolom '+c+' sudah benar ('+ans+').':'💡 Angka yang benar di baris '+r+', kolom '+c+' adalah '+ans+'. Sudah kuisikan untukmu.';return}
 if(a==='c'){X.s.sel=+b.dataset.i;sdDraw();return}
 if(a==='n'){const q=X.s;if(q.sel<0||q.fx[q.sel])return;q.cur[q.sel]=v;sdDraw();return}
 if(a==='chk'){
  if(X.k==='sd'){const q=X.s,m=document.getElementById('gxm'),full=q.cur.every(x=>x),bad=q.cur.some((_,i)=>sdBad(q.cur,i));
   if(!full)m.textContent='Masih ada kotak kosong.';else if(bad)m.textContent='Ada angka kembar, periksa kotak merah.';
   else if(q.won)m.textContent='🎉 Sudah benar! Tekan Baru untuk soal lain.';
   else{q.won=1;const p=win('Sudoku '+SD_LV[q.lv-1],SD_PTS[q.lv-1]);m.textContent='🎉 Benar semua! '+('+'+p+' poin')}}
  else{const q=X.t,ok=q.rows.every(r=>[...r.bl].every(j=>+r.v[j]===r.a[j]&&r.v[j]!=='')),first=ok&&!q.won;let p=0;
   if(first){q.won=1;p=win('Deret Tabel '+LV[q.lv-1],DT_PTS[q.lv-1])}
   q.show=ok;dtDraw(true);const m=document.getElementById('gxm');
   m.textContent=ok?(first?'🎉 Semua benar! '+('+'+p+' poin'):'🎉 Sudah benar! Tekan Baru untuk soal lain.'):'Kotak hijau benar, merah perlu dicek.'}}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.g==='v'&&X.t&&X.t.rows[+t.dataset.r]){X.t.rows[+t.dataset.r].v[+t.dataset.c]=t.value}});

(()=>{

            const pt = await setSub(email, mo);
            await sysMsg('✅ Akses kamu sudah aktif' + (pt.expiresAt ? ' sampai ' + fmtD2(pt.expiresAt) : '') + '. Silakan masuk ke aplikasi.', { status: 'approved' });
          } else if (b.id === 'cxoff') {

            await F.deleteDoc(F.doc(db, 'requests', email)); close();
          }
        } catch (e) { fail(e); }
      });

    }

    function watchMember(em) {                                   // setelah admin menyetujui → otomatis masuk
      if (unMember) return;
      unMember = F.onSnapshot(F.doc(db, 'members', em), s => { if (s.exists() && isLive(s.data())) location.reload(); }, () => {});
    }
    /* keluar dari gerbang: akun yang BUKAN member dihapus (beserta datanya) — tidak ada data non-member yang tersimpan */
    const leaveGate = async user => {
      if (!gHad && user) {
        try { await F.deleteDoc(F.doc(db, COLLECTION, user.uid)); } catch (e) {}
        try { await user.delete(); } catch (e) {}
      }
      try { await A.signOut(auth); } catch (e) {}
      try { localStorage.removeItem('focusnest'); localStorage.removeItem('focusnest_uid'); } catch (e) {}
      location.reload();
    };

    const logoutBtn = { label: 'Keluar / ganti akun', fn: () => leaveGate(null) };

    function gate(user) {
      const em = (user.email || '').toLowerCase();
      watchMember(em);
      const btns = [{ label: 'Beli akses', primary: true, fn: () => { location.href = BUY_URL; } }, { label: '💬 Konfirmasi admin', fn: () => support(user) }];
      if (TG_URL) btns.push({ label: 'Telegram', fn: () => window.open(TG_URL, '_blank', 'noopener') });
      btns.push({ label: 'Keluar / ganti akun', fn: () => leaveGate(user) });
      if (gExp) { const bt = [{ label: 'Perpanjang langganan', primary: true, fn: () => { location.href = BUY_URL; } }, { label: '💬 Konfirmasi admin', fn: () => support(user) }, { label: 'Keluar / ganti akun', fn: () => leaveGate(user) }]; showBlock('Langgananmu sudah berakhir', 'Langganan berakhir pada ' + fmtD2(gExp) + '. Perpanjang, lalu konfirmasi ke admin — akses aktif otomatis setelah diperpanjang. Datamu tetap tersimpan.', bt, '⏳', 'Masuk sebagai ' + (user.email || '')); return; }
      showBlock('Kamu belum jadi member', 'FocusNest hanya untuk yang sudah membayar. Gunakan email yang sama saat checkout, atau konfirmasi ke admin. Data akun non-member tidak disimpan.', btns, '🔒', 'Masuk sebagai ' + (user.email || ''));
    }

    function support(user) {
      const em = (user.email || '').toLowerCase();
      watchMember(em);
      openChat({ email: em, admin: false, name: user.displayName || '', onClose: () => gate(user) });
    }

    /* ================= LAYAR LOGIN ================= */
    let mode = 'login';
    const MODES = {
      login:    { t: 'Masuk', s: 'Masuk untuk membuka rencana dan goals-mu di perangkat mana pun.', b: 'Masuk', pw: 'current-password',
                  ft: 'Belum punya akun? <button type="button" class="ln" data-m="register">Daftar</button> · <button type="button" class="ln" data-m="reset">Lupa kata sandi?</button>' },
      register: { t: 'Buat akun', s: 'Khusus yang sudah membeli — gunakan email yang sama saat checkout. Akun non-member tidak menyimpan data.', b: 'Daftar', pw: 'new-password',
                  ft: 'Sudah punya akun? <button type="button" class="ln" data-m="login">Masuk</button>' },
      reset:    { t: 'Reset kata sandi', s: 'Masukkan email-mu, kami kirim tautan untuk membuat kata sandi baru.', b: 'Kirim tautan reset', pw: null,
                  ft: '<button type="button" class="ln" data-m="login">← Kembali ke halaman masuk</button>' }
    };
    const msg = (t, ok) => { const m = $q('#lgn-m'); m.textContent = t || ''; m.classList.toggle('ok', !!ok); };
    function setMode(k) {
      mode = k; const M = MODES[k];
      $q('#lgn-t').textContent = M.t; $q('#lgn-s').textContent = M.s; $q('#lgn-b').textContent = M.b; $q('#lgn-ft').innerHTML = M.ft;
      $q('#lgn-pl').hidden = $q('#lgn-cl').hidden = !M.pw;
      $q('#lgn-g').hidden = $q('#lgn-or').hidden = k === 'reset';
      if (M.pw) $q('#lgn-p').autocomplete = M.pw;
      msg(''); $q('#lgn-e').focus();
    }
    const busy = on => { $q('#lgn-b').disabled = $q('#lgn-g').disabled = on; };
    setMode('login');

    OV.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) setMode(b.dataset.m); });
    $q('#lgn-sh').addEventListener('change', e => { $q('#lgn-p').type = e.target.checked ? 'text' : 'password'; });

    $q('#lgn-f').addEventListener('submit', async e => {
      e.preventDefault(); msg('');
      const em = $q('#lgn-e').value.trim(), pw = $q('#lgn-p').value;
      if (!em) { msg(MSG['auth/missing-email']); return; }
      if (mode !== 'reset' && !pw) { msg(MSG['auth/missing-password']); return; }
      if (mode === 'register' && pw.length < 6) { msg(MSG['auth/weak-password']); return; }
      busy(true);
      try {
        if (mode === 'reset') { await A.sendPasswordResetEmail(auth, em); msg('Tautan reset sudah dikirim. Cek inbox dan folder spam email-mu.', true); }
        else if (mode === 'register') await A.createUserWithEmailAndPassword(auth, em, pw);   // tanpa verifikasi email
        else await A.signInWithEmailAndPassword(auth, em, pw);
      } catch (x) { msg(errMsg(x)); }
      finally { busy(false); }
    });

    $q('#lgn-g').addEventListener('click', async () => {
      msg(''); busy(true);
      const prov = new A.GoogleAuthProvider();
      try { await A.signInWithPopup(auth, prov); }
      catch (x) {
        if (x.code === 'auth/popup-blocked' || x.code === 'auth/operation-not-supported-in-this-environment') {
          try { await A.signInWithRedirect(auth, prov); return; } catch (y) { x = y; }
        }
        if (x.code !== 'auth/popup-closed-by-user' && x.code !== 'auth/cancelled-popup-request') msg(errMsg(x));
      } finally { busy(false); }
    });
    A.getRedirectResult(auth).catch(x => { showForm(); msg(errMsg(x)); });

    /* ================= STATUS LOGIN ================= */
    A.onAuthStateChanged(auth, async user => {
      resolved = true;
      if (!user) { showForm(); return; }
      if (user.isAnonymous) { await A.signOut(auth); return; }       // sesi anonim versi lama → minta login
      showLoad();
      const em = (user.email || '').toLowerCase();
      const retryBtn = { label: 'Coba lagi', primary: true, fn: () => location.reload() };
      let ok = false, hadDoc = false;
      try {
        const m = await F.getDoc(F.doc(db, 'members', em));
        hadDoc = m.exists();
        const md = m.exists() ? m.data() : null; ok = isLive(md); gExp = (md && String(md.active) === 'true' && !ok) ? tsNum(md.expiresAt) : 0;
        if (!ok) { try { ok = (await F.getDoc(F.doc(db, 'admins', em))).exists(); admPass = ok; } catch (e2) {} }   // admin selalu boleh masuk
      } catch (e) {
        console.error('[FocusNest] Gagal cek member:', e);
        showBlock('Gagal memeriksa status member', 'Cek koneksi internetmu lalu coba lagi.' + (e && e.code === 'permission-denied' ? ' (Firestore Rules menolak — periksa Rules di Firebase Console.)' : ''), [retryBtn, logoutBtn], '⚠️'); return;
      }
      if (!ok) { gHad = hadDoc; try { FN.apply(null); localStorage.removeItem('focusnest'); localStorage.removeItem('focusnest_uid'); } catch (e2) {} gate(user); return; }   // non-member: data lokal dibersihkan, tidak ada yang disimpan                               // bukan member: akun TIDAK dihapus, hanya ditahan di gerbang
      let good = false;
      try { good = await start(user); } catch (e) { console.error('[FocusNest] Gagal memulai sesi:', e); }
      if (!good) { showBlock('Data belum bisa dimuat', 'Datamu aman di cloud. Cek koneksi lalu coba lagi — aplikasi sengaja tidak dibuka agar data tidak tertimpa.', [retryBtn, logoutBtn], '☁️'); return; }
      hideOV(); setupAdmin(user);
    });
  } catch (e) {
    failOpen('Firebase tidak dapat dimuat.', e);
  }
})();
</script>

</body>
</html>
