<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FocusNest — Plan · Focus · Grow · Achieve</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4FF;--card:#fff;--ink:#1B2A4A;--mu:#6B7A99;--ln:#DCE6FA;--ac:#4F7CF0;--as:#E3ECFF;--ok:#25A57A;--wn:#E5703F;--rd:#E5484D;--yl:#F5B83D}
:root[data-t=dark]{--bg:#0E1526;--card:#18223B;--ink:#EAF0FF;--mu:#96A3C4;--ln:#2A3759;--ac:#7FA2FF;--as:#233157;--ok:#4FD1A5;--wn:#FF9566;--rd:#FF7378;--yl:#FFD166}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3{margin:0;line-height:1.2}h1{font-size:1.5rem}h2{font-size:1.1rem;margin-bottom:8px}
.mu{color:var(--mu);font-size:.88rem}
#side{position:fixed;inset:0 auto 0 0;width:196px;background:var(--card);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
#side .lg{font-weight:800;font-size:1.2rem;padding:0 8px 14px}
#side button{display:flex;gap:10px;align-items:center;background:none;color:var(--mu);text-align:left;padding:10px;border-radius:10px;border:0;font:inherit;font-weight:600;cursor:pointer}
#side button[aria-current=page]{background:var(--as);color:var(--ac)}
main{margin-left:196px;padding:22px;max-width:1000px}
.g{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.g>.c{margin:0}
.hero{background:linear-gradient(120deg,var(--as),var(--card));display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
#clk{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ac)}
.st b{display:block;font-size:1.5rem}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.b.s{background:var(--as);color:var(--ac)}.b.sm{padding:4px 9px;font-size:.82rem}.b.x{background:none;color:var(--mu);padding:4px 8px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.f>*{flex:1 1 130px}.f>.n{flex:0 0 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs .b{flex:0 0 auto}
.tk{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}.tk:last-child{border:0}
.tk input[type=checkbox]{width:20px;height:20px;flex:0 0 auto;accent-color:var(--ac);padding:0}
.tk>div{flex:1;min-width:0}.tk.dn b{text-decoration:line-through;color:var(--mu)}.tk select{width:auto}
.tk input[type=number]{width:62px}
.tag{display:inline-block;font-size:.75rem;background:var(--as);color:var(--ac);border-radius:20px;padding:0 8px;margin-right:4px}
.tag.Tinggi,.tag.Top{background:#E5484D22;color:var(--rd)}.tag.Sedang{background:#F5B83D33;color:var(--wn)}
.bar{height:8px;background:var(--ln);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.tm{font-size:4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal button{aspect-ratio:1;border:1px solid var(--ln);background:var(--bg);border-radius:10px;cursor:pointer;position:relative;padding:0}
.cal button.td{border-color:var(--ac);font-weight:800}.cal button.sl{background:var(--ac);color:#fff}
.cal button i{position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--wn)}
.cal small{color:var(--mu)}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}.bars div{flex:1;text-align:center;font-size:.72rem;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px}
.mo{display:flex;gap:8px;flex-wrap:wrap}.mo button{font-size:1.8rem;background:var(--bg);border:2px solid var(--ln);border-radius:14px;padding:6px 10px;cursor:pointer}.mo button.on{border-color:var(--ac);background:var(--as)}
.sn{display:flex;gap:8px;flex-wrap:wrap}.sn div{background:#FFF3B8;color:#4A3F00;border-radius:10px;padding:10px;width:150px;font-size:.88rem;position:relative}
.sn div:nth-child(2n){background:#CFE3FF;color:#17325E}.sn div:nth-child(3n){background:#D5F5E3;color:#15432E}
.sn button{position:absolute;top:0;right:2px;background:none;border:0;cursor:pointer;color:inherit}
#dw{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#dw.on{display:flex}#dw .tm{font-size:6rem}
.tl{display:grid;grid-template-columns:54px 1fr;gap:4px 8px}.tl span{color:var(--mu);font-variant-numeric:tabular-nums}
@media(max-width:820px){
#side{inset:auto 0 0 0;width:auto;flex-direction:row;overflow-x:auto;border:0;border-top:1px solid var(--ln);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0));z-index:10}
#side .lg{display:none}#side button{flex-direction:column;gap:0;font-size:.68rem;padding:6px 10px;flex:0 0 auto}
main{margin:0;padding:14px 12px 96px}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.tm{font-size:3.2rem}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
/* ===================== FocusNest v2 · aesthetic & fitur baru ===================== */
:root{--b1:rgba(255,184,217,.45);--b2:rgba(160,214,255,.5);--b3:rgba(196,178,255,.4);--sh:0 6px 18px rgba(79,124,240,.10)}
:root[data-t=dark]{--b1:rgba(255,115,160,.12);--b2:rgba(79,140,255,.16);--b3:rgba(140,100,255,.14);--sh:0 6px 18px rgba(0,0,0,.25)}
body{background-color:var(--bg);background-image:radial-gradient(520px 380px at 92% -4%,var(--b1),transparent 70%),radial-gradient(640px 460px at -6% 22%,var(--b2),transparent 70%),radial-gradient(560px 460px at 70% 108%,var(--b3),transparent 70%);background-attachment:fixed;min-height:100vh}
h1,h2,h3,#side .lg,.mh{font-family:"Fredoka","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h3{font-size:.98rem}
.c{box-shadow:var(--sh)}
main{position:relative;z-index:1}
#side{z-index:5;overflow-y:auto}
#side .lg{display:flex;gap:6px;align-items:center}
#side .lgt{background:linear-gradient(90deg,var(--ac),#FF7AB6);-webkit-background-clip:text;background-clip:text;color:transparent}
#side button span{display:inline-block;transition:transform .2s}
#side button:hover span{transform:scale(1.25) rotate(-8deg)}
#side button[aria-current=page]{background:linear-gradient(90deg,var(--as),transparent);box-shadow:inset 3px 0 0 var(--ac)}
#side .pt{margin-top:auto;background:linear-gradient(135deg,var(--as),var(--card));border:1px solid var(--ln);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
#side .pt .bar{margin:4px 0 0}
.hero{background:linear-gradient(120deg,var(--as),var(--card) 60%,rgba(255,184,217,.25))}
.b{box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .12s,filter .15s}
.b.x{box-shadow:none}
.b:hover{filter:brightness(1.07);transform:translateY(-1px)}
.b:active{transform:translateY(1px) scale(.97)}
.bar i{background:linear-gradient(90deg,var(--ok),#6FE3B5)}
.rwc .bar i{background:linear-gradient(90deg,var(--ac),#FF7AB6)}
.bar.pf i{background:linear-gradient(90deg,#FFB347,#FFD166)}
.bar.pj i{background:linear-gradient(90deg,#FF7AB6,#FFB3D1)}
.tk.dn{opacity:.78}
.st{transition:transform .15s}.st:hover{transform:translateY(-3px)}

/* tag prioritas & kesulitan */
button.tag{border:0;font:inherit;font-size:.75rem;cursor:pointer}
button.tag:hover{filter:brightness(.95);text-decoration:underline dotted}
.tag.Rendah{background:#25A57A22;color:var(--ok)}
.tag.df-Mudah{background:#4F7CF022;color:var(--ac)}
.tag.df-Sedang{background:#8B5CF622;color:#8B5CF6}
.tag.df-Sulit{background:#E5703F22;color:var(--wn)}
.tag.df-Expert{background:linear-gradient(90deg,#FF7AB633,#8B5CF633);color:#C2307E}
:root[data-t=dark] .tag.df-Sedang,:root[data-t=dark] .tag.gl{color:#B79CFF}
:root[data-t=dark] .tag.df-Expert{color:#FF8FC4}
.tag.pt{background:#F5B83D33;color:var(--wn);font-weight:700}
.tag.gl{background:#8B5CF622;color:#8B5CF6;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
#ppv{font-size:.8rem}

/* panduan mulai */
.guide{background:linear-gradient(135deg,var(--as),var(--card));border-style:dashed}

/* toast, konfeti */
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:22px;font-weight:600;font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center}
.toast.big{background:linear-gradient(90deg,#FF7AB6,#8B5CF6);color:#fff;font-size:1rem;padding:11px 20px}
.pc{position:fixed;pointer-events:none;z-index:60;font-size:1.3rem;transform:translate(-50%,-50%)}
@keyframes pc{from{transform:translate(-50%,-50%) scale(.6);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(1.1);opacity:0}}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(1.03,.98)}}
@keyframes sad{0%,100%{transform:rotate(-3deg) translateY(3px)}50%{transform:rotate(3deg) translateY(3px)}}
@keyframes chew{0%,100%{transform:scale(1)}50%{transform:scale(1.12,.88)}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-28px) rotate(8deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,6px) scale(.8)}50%{opacity:1}100%{opacity:0;transform:translate(8px,-14px) scale(1.2)}}
@keyframes eq{0%,100%{height:4px}50%{height:15px}}
@keyframes drift{from{transform:translateX(-12vw) translateY(0)}50%{transform:translateX(48vw) translateY(-20px)}to{transform:translateX(112vw) translateY(0)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}

/* dekor latar */
#bgd{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bgd span{position:absolute;font-size:2rem;opacity:.3}

/* kalender tahunan */
.yg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:12px}
.ym{padding:12px}.ym .bar{margin:4px 0 8px}
.mh{background:none;border:0;font-size:1.05rem;font-weight:700;color:var(--ink);cursor:pointer;padding:0;display:block;text-transform:capitalize}
.mh:hover{color:var(--ac)}
.ycal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.ycal small{font-size:.65rem;color:var(--mu)}
.yd{aspect-ratio:1;border:0;border-radius:7px;background:transparent;font-size:.72rem;cursor:pointer;position:relative;padding:0;color:var(--ink);transition:transform .1s}
.yd:hover{background:var(--as);transform:scale(1.15);z-index:2}
.ht1{background:var(--as);background:color-mix(in srgb,var(--ac) 18%,var(--card))}
.ht2{background:var(--as);background:color-mix(in srgb,var(--ac) 38%,var(--card))}
.ht3{background:var(--ac);background:color-mix(in srgb,var(--ac) 60%,var(--card))}
.ht4{background:var(--ac);background:color-mix(in srgb,var(--ac) 82%,var(--card));color:#fff}
.yd.td{outline:2px solid var(--ac);outline-offset:1px;font-weight:800}
.yd.ok{box-shadow:inset 0 0 0 2px var(--ok)}
.yd.sl{background:var(--ac);color:#fff}
.yd .hi,.yd .gi{position:absolute;top:2px;width:5px;height:5px;border-radius:50%}
.yd .hi{right:2px;background:var(--rd)}.yd .gi{left:2px;background:#A66BFF}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--mu);margin-top:12px;align-items:center}
.leg span{display:inline-flex;gap:5px;align-items:center}
.leg b{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--ln)}
.leg em{width:8px;height:8px;border-radius:50%;display:inline-block;font-style:normal}

/* laci tanggal */
#dr{display:none}#dr.on{display:block}
#dr .bk{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:40}
#dr .sh{position:fixed;right:0;top:0;bottom:0;width:min(430px,100%);background:var(--card);z-index:41;padding:18px;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:-10px 0 40px rgba(0,0,0,.25);border-left:1px solid var(--ln)}
#dr .sh h3{margin-top:6px}

/* musik */
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:12px}
.mc{position:relative;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh);transition:transform .15s,border-color .15s;color:var(--ink)}
.mc:hover{transform:translateY(-3px)}
.mc.on{border-color:var(--ac);background:linear-gradient(160deg,var(--as),var(--card))}
.mc .me{font-size:2rem;line-height:1.1}.mc .mu{display:block;font-size:.8rem}
.mc .eq{position:absolute;right:12px;top:14px}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:16px;vertical-align:middle}
.eq i{width:3px;height:5px;background:var(--ac);border-radius:2px}
.eq.sm{height:12px;margin-left:6px}
#mp{display:none;position:fixed;right:14px;bottom:14px;z-index:25;background:var(--card);border:1px solid var(--ln);border-radius:30px;padding:7px 14px;box-shadow:0 8px 24px rgba(0,0,0,.2);align-items:center;gap:10px;max-width:calc(100vw - 28px)}
#mp.on{display:flex}
#mp .me2{font-size:1.4rem}
#mp b{font-size:.82rem;white-space:nowrap}
#mp input{width:84px;padding:0;accent-color:var(--ac)}
input[type=range]{accent-color:var(--ac);padding:0}
.yt{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;margin-top:10px;background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* pet */
.ps{position:relative;height:230px;border-radius:20px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;border:1px solid var(--ln)}
.ps.sm{height:150px}
.ps::before{position:absolute;left:0;right:0;bottom:6px;text-align:center;word-spacing:18px;font-size:1.4rem;pointer-events:none;opacity:.9}
.hb-room{background:linear-gradient(#FFE9DC 0 64%,#E7C7A4 64%)}.hb-room::before{content:'🪴 🖼️ 🛋️'}
.hb-gar{background:linear-gradient(#BDE8FF 0 60%,#9BD67A 60%)}.hb-gar::before{content:'🌳 🌷 ☁️ 🌻'}
.hb-sak{background:linear-gradient(#FFE0EC 0 62%,#F7B9CF 62%)}.hb-sak::before{content:'🌸 🌸 🌸'}
.hb-bea{background:linear-gradient(#9EDCFF 0 45%,#4FC3E8 45% 62%,#F6E2A8 62%)}.hb-bea::before{content:'🌴 🐚 ⛱️'}
.hb-gal{background:linear-gradient(#1a1446,#3b2a7a)}.hb-gal::before{content:'⭐ 🪐 ✨ 🌙'}
.bub{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;color:#1B2A4A;border-radius:14px;padding:6px 12px;font-size:.78rem;font-weight:600;max-width:88%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:2}
.ps.sm .bub{display:none}
.pw{position:relative;margin-bottom:22px;transform:scale(var(--sc,1));transform-origin:bottom center;z-index:1}
.pe{display:block;font-size:5.2rem;line-height:1;background:none;border:0;padding:0;cursor:pointer;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18));transform-origin:50% 100%}
.ps.sm .pe{font-size:3.8rem}
.ps.sad .pe{filter:saturate(.55) drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.ach{position:absolute;left:50%;top:-.7rem;transform:translateX(-50%) rotate(-10deg);font-size:2.3rem;pointer-events:none}
.ps.sm .ach{font-size:1.6rem;top:-.4rem}
.acs{position:absolute;right:-1.6rem;bottom:.2rem;font-size:2rem;pointer-events:none}
.ps.sm .acs{font-size:1.3rem;right:-1.1rem}
.mbd{position:absolute;left:-1.1rem;top:0;font-size:1.3rem}
.zz{position:absolute;right:-.6rem;top:-1.6rem;font-size:1.3rem}
.shg{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.si{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink);transition:transform .15s}
.si:hover{transform:translateY(-3px)}
.si .em{font-size:1.8rem;line-height:1.2}.si.on{border-color:var(--ac);background:var(--as)}
.si .mu{font-size:.76rem}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bd{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:10px;text-align:center}
.bd .em{font-size:1.8rem}.bd.lk{filter:grayscale(1);opacity:.5}
.bd.ok{background:linear-gradient(160deg,#FFF3B8,var(--card));color:#4A3F00}
:root[data-t=dark] .bd.ok{background:linear-gradient(160deg,#4a3f12,var(--card));color:#FFE9A0}
.bd small{display:block;color:var(--mu);font-size:.72rem}
.chip{display:inline-block;background:var(--as);color:var(--ac);border:0;border-radius:20px;padding:4px 10px;font-size:.8rem;cursor:pointer;margin:2px 4px 2px 0}
.rw{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.rw>div{flex:1;min-width:0}.rw:last-child{border:0}

/* animasi (hanya jika pengguna tidak membatasi gerak) */
@media(prefers-reduced-motion:no-preference){
#app.anim>*{animation:fadeUp .45s both}
#app.anim>*:nth-child(2){animation-delay:.06s}#app.anim>*:nth-child(3){animation-delay:.12s}#app.anim>*:nth-child(n+4){animation-delay:.18s}
#bgd span{animation:drift 30s linear infinite}
#side .lg .lgi{animation:wig 3.5s ease-in-out infinite}
.tk input[type=checkbox]:checked{animation:pop .35s}
.toast{animation:tin .3s}
.pc{animation:pc 1s ease-out forwards}
#dr .bk{animation:fade .2s}#dr .sh{animation:slin .25s}
.pe{animation:bob 2.4s ease-in-out infinite}
.ps.sad .pe{animation:sad 3.2s ease-in-out infinite}
.fx-eat .pe{animation:chew .45s ease-in-out 4}
.fx-play .pe{animation:jump .55s ease-in-out 4}
.acs{animation:float 3s ease-in-out infinite}
.zz{animation:zz 2.2s ease-in-out infinite}
.eq i{animation:eq .9s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
.bar i{transition:width .5s}
}
@media(prefers-reduced-motion:reduce){.pc{display:none}}
@media(max-width:820px){
#side .pt{display:none}
#side button[aria-current=page]{box-shadow:inset 0 -3px 0 var(--ac);background:var(--as)}

function burst(el,em,n){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=el&&el.getBoundingClientRect?el.getBoundingClientRect():null,x=r?r.left+r.width/2:innerWidth/2,y=r?r.top+r.height/2:innerHeight/3,a=[...(em||'✨')];n=n||10;

function logP(p,w){S.pl.push({d:TD(),w,p});if(S.pl.length>40)S.pl=S.pl.slice(-40)}

function spend(p,w){S.pts=Math.max(0,S.pts-p);logP(-p,w)}
function undo(p,w){S.pts=Math.max(0,S.pts-p);S.xp=Math.max(0,S.xp-p);logP(-p,w)}

function taskDone(T,el){if(T.rw)return;const p=ptsOf(T)+((T.due||TD())>=TD()?5:0);T.rw=p;gain(p,'Selesai: '+T.t);

  ${alCtl()}<h3 style="margin:12px 0 6px">Pengingat harian</h3><div class="f"><label class="cli" style="flex:0 0 auto"><input type="checkbox" data-a="rmset" data-k="rmAmOn" ${s.rmAmOn?'checked':''}> ☀️ Rencanakan hari</label><input type="time" data-a="rmset" data-k="rmAm" value="${s.rmAm||'07:30'}" aria-label="Jam pengingat pagi" style="flex:0 1 120px"><label class="cli" style="flex:0 0 auto"><input type="checkbox" data-a="rmset" data-k="rmPmOn" ${s.rmPmOn?'checked':''}> 🌙 Refleksi malam</label><input type="time" data-a="rmset" data-k="rmPm" value="${s.rmPm||'20:30'}" aria-label="Jam pengingat malam" style="flex:0 1 120px"></div>

function rmBeep(){try{const c=actx(),t=c.currentTime;[0,.28,.56].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=i===2?1175:880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.22,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.24);o.start(t+d);o.stop(t+d+.26)})}catch(e){}}
function rmTitle(){if(!document.querySelector('.rmi'))document.title=TTL}
function rmFire(o){if(!fnDev())return;try{const L=petLine(o);if(L)o.body=L+' · '+o.body}catch(e){}if(S.set.rmSnd!==false)rmBeep();if(S.set.rmVib!==false)try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  try{if('Notification' in window&&Notification.permission==='granted'){fnNotify(o)}}catch(e){}
  const box=$('#rmb');if(box){const d=document.createElement('div');d.className='rmi';d.innerHTML=`<div><b>${esc(o.title)}</b><div class="mu">${esc(o.body)}</div></div><div class="f" style="justify-content:flex-end">${o.tid?`<button class="b s sm n" data-a="rmsnz" data-i="${o.tid}">Tunda 5 mnt</button>`:''}<button class="b sm n" data-a="rmok">Oke 👍</button></div>`;box.appendChild(d)}
  document.title='⏰ '+o.title}
function askNotif(){try{if(!('Notification' in window)){toast('Browser tidak mendukung notifikasi sistem — pengingat tetap tampil di aplikasi 🙂');return}
  Notification.requestPermission().then(p=>{S.set.rmSeen=1;sv();render();if(p==='granted')rmFire({title:'🔔 Pengingat aktif!',body:'Kamu akan diingatkan sesuai jadwal tugasmu.',key:'t'});else toast('Notifikasi tidak diizinkan — pengingat tetap tampil di dalam aplikasi.')})}catch(e){toast('Gagal meminta izin notifikasi')}}
function remind(){const st=S.set;if(st.rmOn===false)return;const now=Date.now(),T0=TD();
  S.tasks.forEach(t=>{if(!t.time||t.st==='selesai'||t.st==='tunda'||t.rm==='off')return;const ms=new Date((t.due||T0)+'T'+t.time).getTime();if(isNaN(ms))return;
    const lead=t.rm!==undefined&&t.rm!==''?+t.rm:(+st.rmLead||0);

      const retryBtn = { label: 'Cek lagi', primary: true, fn: () => location.reload() };
      const buyBtn = BUY_URL.indexOf('GANTI-') === -1 ? [{ label: 'Beli akses FocusNest', primary: true, fn: () => { location.href = BUY_URL; } }] : [];
      if (!user.emailVerified) {
        showBlock('Email belum terverifikasi', 'Masuk dengan Google, atau klik "Lupa kata sandi" di halaman masuk untuk mengatur kata sandi lewat email yang kamu pakai saat checkout.', [{ label: 'Kirim ulang email verifikasi', primary: true, fn: async () => { try { await A.sendEmailVerification(user); alert('Email verifikasi dikirim. Cek inbox/spam.'); } catch (e) { alert('Tunggu sebentar lalu coba lagi.'); } } }, { label: 'Sudah verifikasi — cek lagi', fn: async () => { try { await user.reload(); } catch (e) {} location.reload(); } }, logoutBtn]); return;
      }
      let ok = false;
      try {
        const m = await F.getDoc(F.doc(db, 'members', (user.email || '').toLowerCase()));
        ok = m.exists() && m.data().active === true;
      } catch (e) {
        console.error('[FocusNest] Gagal cek member:', e);
        showBlock('Gagal memeriksa status member', 'Cek koneksi internetmu lalu coba lagi.', [retryBtn, logoutBtn]); return;
      }
      if (!ok) {
        showBlock('Email ini belum terdaftar sebagai member', 'Akses FocusNest khusus member. Kamu masuk sebagai ' + user.email + '. Gunakan email yang sama dengan saat checkout. Baru bayar? Tunggu 1-2 menit lalu tekan "Cek lagi".', buyBtn.concat([{ label: 'Cek lagi', fn: () => location.reload() }, logoutBtn])); return;
      }
      try { await start(user); } catch (e) { console.error('[FocusNest] Gagal memulai sesi:', e); }
      hideOV();
    });
  } catch (e) {
    failOpen('Firebase tidak dapat dimuat.', e);
  }
})();
</script>
</body>
</html>
